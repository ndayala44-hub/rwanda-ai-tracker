# Serves the dashboard and proxies the API under the same origin, so the
# browser talks to /api/* with no CORS involved and no hard-coded backend URL.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The dashboard reads its backend address from app-config.js, which the
  # compose file mounts over the default. Injecting an inline script here would
  # be blocked by the page's own Content-Security-Policy.

  location /api/ { proxy_pass http://api:4010; proxy_set_header Host $host; }
  location /health { proxy_pass http://api:4010/health; }
  location /docs   { proxy_pass http://api:4010/docs; }

  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/html application/javascript application/json text/css;
  gzip_min_length 1024;
}
