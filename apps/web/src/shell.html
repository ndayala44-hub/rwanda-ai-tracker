<!DOCTYPE html>
<!-- Dark is the default presentation. The toggle still switches to light and
     the light palette is fully maintained. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- No inline event handlers remain, so a strict policy is possible. The
     application is one inline script — that is what makes the file portable —
     so it is allow-listed by hash, injected at build time, rather than by
     'unsafe-inline'. Style still needs 'unsafe-inline' because the design
     system sets CSS custom properties on individual elements. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdnjs.cloudflare.com __INLINE_SCRIPT_HASH__;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' http://localhost:4010 https:;
  font-src 'self';
  base-uri 'self';
  form-action 'none'"/>
<!-- frame-ancestors cannot be delivered via meta; it is set as an HTTP header
     in vercel.json and deploy/nginx.conf instead. -->
<title>Rwanda AI Tracker — evidence-based intelligence on Rwanda's AI ecosystem</title>
<!-- Charting library: the vendored copy is authoritative, the CDN is a fallback.
     A government analytics tool should not depend on a third party being up, and
     an unpinned CDN script is an unreviewed code path. Run `npm run vendor:echarts`
     to populate apps/web/vendor/ and write the integrity hash into the loader.
     No inline handler is used, because a strict CSP forbids them. -->
<!-- Nothing is loaded by a static tag. The deployment config and the charting
     library are fetched at boot, each failure tolerated, so the single file
     still works when it is opened straight from disk with no server. -->
<style>
:root[data-theme="light"]{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#FAFBFD; --raised:#FFFFFF;
  --line:#E3E8EF; --line2:#CFD8E3; --hover:#F1F5FA;
  --txt:#111B2B; --txt2:#42546B; --mut:#6B7C93; --dim:#93A1B5;
  --brand:#0A6FA8; --brand2:#0E88CC; --accent:#00A1DE;
  --green:#1B8A5A; --amber:#B8770E; --red:#C0392B; --violet:#5E4BB8; --teal:#0F8B84;
  --chip:#F0F4F9; --shadow:0 1px 2px rgba(16,30,54,.06),0 4px 14px rgba(16,30,54,.05);
  --ec-axis:#93A1B5; --ec-split:#EDF1F6; --ec-tip:#FFFFFF; --ec-tipline:#CFD8E3;
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#101C2E; --surface2:#0D1829; --raised:#142438;
  --line:#1D3149; --line2:#27405C; --hover:#16273C;
  --txt:#E4ECF5; --txt2:#A9BCD0; --mut:#7D93AB; --dim:#5A7089;
  --brand:#3FA9E0; --brand2:#5CBDEE; --accent:#4FC3F7;
  --green:#3ECF8E; --amber:#E8A33C; --red:#E8695C; --violet:#9B8BF0; --teal:#3FD0C9;
  --chip:#16273C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --ec-axis:#7D93AB; --ec-split:#1A2C42; --ec-tip:#142438; --ec-tipline:#27405C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  transition:background .18s,color .18s}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}

#app{display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;min-height:58px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0}
.mark{width:40px;height:40px;flex:0 0 40px;position:relative;display:flex;align-items:center;justify-content:center}
.mark img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 45%,transparent))}
:root[data-theme="light"] .mark img{filter:saturate(1.05) drop-shadow(0 1px 2px rgba(10,111,168,.25))}
.logo h1{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.logo p{font-size:10.5px;color:var(--mut);letter-spacing:.3px}
.topnav{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap;flex:1}
.topnav a{padding:7px 11px;border-radius:6px;font-size:13px;color:var(--txt2);text-decoration:none;cursor:pointer;white-space:nowrap}
.topnav a:hover{background:var(--hover);color:var(--txt)}
.topnav a.on{background:var(--brand);color:#fff;font-weight:500}
.topright{display:flex;align-items:center;gap:8px;margin-left:auto}
.iconbtn{background:var(--surface);border:1px solid var(--line2);color:var(--txt2);height:30px;min-width:30px;padding:0 8px;
  border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--hover);color:var(--txt)}
.iconbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.freshbar{background:var(--surface2);border-bottom:1px solid var(--line);padding:6px 18px;display:flex;gap:18px;
  flex-wrap:wrap;font-size:11.5px;color:var(--mut);align-items:center}
.freshbar b{color:var(--txt2);font-weight:600}
main{flex:1;padding:20px 18px 60px;max-width:1580px;width:100%;margin:0 auto}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red)} .dot.b{background:var(--brand)}
.pulse{animation:pl 2.6s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}

.vh{margin-bottom:18px}
.vh .eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);font-weight:600}
.vh h2{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.vh p{font-size:14px;color:var(--mut);margin-top:6px;max-width:900px;line-height:1.6}
.vhrow{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}

.row{display:grid;gap:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:13.5px;font-weight:650;letter-spacing:-.1px}
.card>header .sub{font-size:11.5px;color:var(--mut)}
.card .bd{padding:15px}
.card .bd.flush{padding:0}
.kpi{padding:15px}
.kpi .lbl{font-size:11.5px;color:var(--mut);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-1.2px;margin-top:5px;line-height:1.05}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:5px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.3px;
  padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--txt2);white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.tag.a{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.b{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.tag.v{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.tag.t{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.btn{background:var(--surface);border:1px solid var(--line2);color:var(--txt2);font-size:12.5px;padding:6px 12px;
  border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--txt)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--chip);border-radius:7px;padding:2px}
.seg button{background:transparent;border:0;color:var(--mut);padding:5px 11px;border-radius:5px;cursor:pointer;
  font-size:12.5px;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--txt);font-weight:600;box-shadow:var(--shadow)}
input.txt,select.sel,textarea.txt{background:var(--surface);border:1px solid var(--line2);color:var(--txt);
  padding:6px 10px;border-radius:7px;font-size:13px;font-family:inherit;outline:none}
input.txt:focus,select.sel:focus{border-color:var(--brand)}
label.fl{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:16px;
  border:1px solid var(--line2);background:var(--surface);color:var(--txt2);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut)} .kv .v{color:var(--txt);text-align:right}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--mut)}
.muted{color:var(--mut)} .small{font-size:11.5px}
.prose{font-size:13.5px;line-height:1.75;color:var(--txt2)}
.prose b,.prose strong{color:var(--txt)}
.prose p{margin-bottom:10px}
.prose ul{margin:0 0 10px 18px} .prose li{margin-bottom:5px}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;letter-spacing:.4px;
  color:var(--mut);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tbody tr:hover td{background:var(--hover)}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tr.clickable{cursor:pointer}
.scrollbox{overflow:auto}

.empty{padding:30px 20px;text-align:center;color:var(--mut);font-size:13px}
.empty .big{font-size:15px;color:var(--txt2);font-weight:600;margin-bottom:6px}
.unavail{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-style:italic}

/* provenance / quality */
.prov{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mut)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--brand);cursor:pointer;text-decoration:none}
.src:hover{text-decoration:underline}
.qbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px}
.q-verified{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.q-review{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.q-unverified{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.q-modelled{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.q-historical{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--line2);color:var(--mut);font-size:10px;cursor:help;flex:0 0 15px}
.info:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:0 0 18px 0}
.tlitem:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--brand)}
.tlitem.pending:before{border-color:var(--amber)}
.tlyear{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.4px}
.tlt{font-size:13.5px;font-weight:600;margin-top:1px}
.tld{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.55}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,96vw);background:var(--bg);z-index:61;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column;
  border-left:1px solid var(--line)}
.drawer.on{transform:translateX(0)}
.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dbody{overflow-y:auto;padding:16px 18px 50px;flex:1}
.x{background:transparent;border:1px solid var(--line2);color:var(--mut);width:28px;height:28px;border-radius:7px;cursor:pointer}
.x:hover{color:var(--txt)}
.crumb{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut);flex-wrap:wrap;margin-bottom:10px}
.crumb b{color:var(--brand);font-weight:600;cursor:pointer}

/* matrices & misc */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.hex{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--line)}
.hexcell{background:var(--surface);padding:13px 14px;cursor:pointer}
.hexcell:hover{background:var(--hover)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--txt);color:var(--bg);
  padding:10px 18px;border-radius:9px;font-size:13px;z-index:90;transition:transform .24s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}
.banner{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.6;margin-bottom:14px;border:1px solid}
.banner.hist{background:color-mix(in srgb,var(--teal) 8%,transparent);border-color:color-mix(in srgb,var(--teal) 30%,transparent);color:var(--txt2)}
.banner.warn{background:color-mix(in srgb,var(--amber) 9%,transparent);border-color:color-mix(in srgb,var(--amber) 32%,transparent);color:var(--txt2)}
.banner.info{background:color-mix(in srgb,var(--brand) 7%,transparent);border-color:color-mix(in srgb,var(--brand) 26%,transparent);color:var(--txt2)}
.footer{border-top:1px solid var(--line);background:var(--surface);padding:20px 18px;font-size:12px;color:var(--mut)}
.footer .fgrid{max-width:1580px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.footer b{color:var(--txt2);display:block;margin-bottom:6px;font-size:12.5px}
.footer a{color:var(--mut);text-decoration:none;display:block;padding:2px 0;cursor:pointer}
.footer a:hover{color:var(--brand)}

/* ---------------- v2: modern interaction layer ---------------- */
.card{transition:box-shadow .18s,transform .18s,border-color .18s}
.card.lift:hover{box-shadow:0 2px 4px rgba(16,30,54,.07),0 12px 32px rgba(16,30,54,.10);transform:translateY(-2px);border-color:var(--line2)}
:root[data-theme="dark"] .card.lift:hover{box-shadow:0 2px 6px rgba(0,0,0,.4),0 14px 36px rgba(0,0,0,.35)}
.kpi{position:relative;overflow:hidden}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;opacity:.5;pointer-events:none}
.kpi.clickable{cursor:pointer}
.kpi .val{transition:color .2s}

/* skeletons */
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
.sk{background:linear-gradient(90deg,var(--chip) 8%,var(--hover) 18%,var(--chip) 33%);
  background-size:800px 100%;animation:shimmer 1.25s linear infinite;border-radius:7px}
.skgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}

/* tooltip */
.tip{position:fixed;z-index:95;max-width:320px;background:var(--txt);color:var(--bg);padding:9px 12px;border-radius:8px;
  font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .13s,transform .13s;
  box-shadow:0 10px 30px rgba(0,0,0,.28)}
.tip.on{opacity:1;transform:translateY(0)}
[data-tip]{cursor:help;border-bottom:1px dotted var(--line2)}

/* year scrubber */
.scrub{display:flex;align-items:center;gap:9px}
.scrub input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line2);outline:none;width:150px}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--brand);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
.scrub input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);cursor:pointer}
.scrub b{min-width:34px;font-variant-numeric:tabular-nums}
.histbadge{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber);font-weight:600;
  padding:2px 8px;border-radius:5px;font-size:11px}

/* filter chips bar */
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border-radius:16px;
  padding:5px 8px 5px 12px;font-size:12px;font-weight:500}
.fchip button{background:rgba(255,255,255,.22);border:0;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.fchip button:hover{background:rgba(255,255,255,.4)}

/* command palette */
.pal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:11vh;
  background:rgba(10,20,35,.42);backdrop-filter:blur(3px)}
.pal.on{display:flex}
.palbox{width:min(660px,94vw);background:var(--surface);border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.32);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.palbox input{width:100%;border:0;outline:0;background:transparent;color:var(--txt);font-size:16px;padding:16px 18px;
  font-family:inherit;border-bottom:1px solid var(--line)}
.palres{max-height:52vh;overflow:auto}
.palitem{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.palitem:hover,.palitem.sel{background:var(--hover)}
.palitem .pk{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);background:var(--chip);
  padding:2px 7px;border-radius:5px;flex:0 0 auto}
.palitem .pt{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palitem .ps{font-size:11.5px;color:var(--mut);flex:0 0 auto}
.palfoot{padding:9px 18px;font-size:11.5px;color:var(--mut);display:flex;gap:16px;background:var(--surface2)}
kbd{background:var(--chip);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-size:10.5px;font-family:ui-monospace,monospace;color:var(--txt2)}

/* in-view tabs */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 14px;
  font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* gauges + rings */
.gaugewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.gauge{display:flex;gap:16px;align-items:center;min-width:0}
.gauge .ring{flex:0 0 128px}
.gauge .gi{min-width:0;flex:1}
.gauge h4{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
.gauge .gv{font-size:38px;font-weight:700;letter-spacing:-1.8px;line-height:1.05;margin-top:2px}
.gmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.gmeta b{color:var(--txt2);font-weight:600}
.bento{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.bento>*{grid-column:span 4}
.bento .w6{grid-column:span 6}.bento .w8{grid-column:span 8}.bento .w12{grid-column:span 12}
@media(max-width:1080px){.bento>*{grid-column:span 12}}
.hint{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.hint:before{content:"⌁";color:var(--brand)}


/* -------- coming soon: the form stays visible behind glass -------- */
.comingsoon{position:relative;border-radius:10px;overflow:hidden}
.comingsoon .cs-form{filter:blur(3.5px) saturate(.7);opacity:.65;pointer-events:none;user-select:none;
  transform:scale(.995)}
.cs-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:24px;
  background:color-mix(in srgb,var(--surface) 55%,transparent);
  backdrop-filter:blur(6px) saturate(1.1);-webkit-backdrop-filter:blur(6px) saturate(1.1);
  border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);border-radius:10px}
.cs-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--brand) 32%,transparent);padding:5px 12px;border-radius:20px}
.cs-veil h4{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.cs-veil p{font-size:13px;color:var(--mut);max-width:400px;line-height:1.65}
@media (prefers-reduced-motion: no-preference){
  .cs-badge{animation:csPulse 3.4s ease-in-out infinite}
  @keyframes csPulse{0%,100%{opacity:1}50%{opacity:.62}}
}

/* ---------------- accessibility ---------------- */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brand);color:#fff;
  padding:10px 16px;border-radius:0 0 8px 0;font-size:13px;font-weight:600}
.skip:focus{left:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[data-act]{cursor:pointer}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.charttable{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.charttable th,.charttable td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left}
.charttable th{color:var(--mut);font-weight:600;font-size:11px}
.charttable td.n,.charttable th.n{text-align:right;font-variant-numeric:tabular-nums}
.chartswap{display:flex;justify-content:flex-end;padding:0 12px 8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
@media(max-width:1100px){ .topnav{order:3;flex-basis:100%;padding-bottom:8px;overflow-x:auto} }
@media(max-width:640px){ main{padding:14px 12px 40px} .vh h2{font-size:20px} .kpi .val{font-size:25px} }
</style>
