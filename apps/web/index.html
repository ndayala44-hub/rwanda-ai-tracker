   RWANDA AI TRACKER, application configuration
   ----------------------------------------------------------------------------
   The UI is unchanged. What changed underneath it: nothing on screen is a
   literal any more. Everything resolves through DATA_SOURCES below, in order:
     1. a live API            (?api=https://… or window.TRACKER_API_BASE)
     2. a published snapshot  (./data/bootstrap.json)
     3. the embedded dataset  (so the single file still opens offline)
   ==========================================================================*/
/* Where to look for the backend when nothing else says.
   On localhost the API runs on its own port; anywhere else, a Vercel
   deployment, a reverse proxy, a container, it is served from the same origin,
   so "" is correct and needs no configuration. Opened straight from disk this
   resolves to "" too, the fetch fails harmlessly, and the page falls back to
   the published snapshot and then to its embedded dataset. */
const DEFAULT_API_BASE = (() => {
  if (typeof location === "undefined") return "http://localhost:4010";
  const host = location.hostname;
  return (host === "localhost" || host === "127.0.0.1" || host === "") ? "http://localhost:4010" : "";
})();
const QS = (typeof location!=="undefined") ? new URLSearchParams(location.search) : new URLSearchParams("");
const META = {
  platform: "Rwanda AI Tracker",
  cycle: 2026, firstYear: 2019,
  built: "15 Sep 2026",
  methodology: "v1.3",
  weightSet: "equal-v1",
  engine: "tracker-scoring-engine 2.5.0",
  /* The dashboard is served BY the FastAPI backend in normal operation. The
     resolution order below still degrades gracefully: if the API is down or the
     file is opened straight from disk, the published snapshot and then the
     embedded dataset keep it usable, and the status bar names which one is in
     use, so a stale view can never masquerade as a live one. */
  /* An empty string is a legitimate value, it means "same origin", which is
     how the reverse-proxy deployment is configured. Testing truthiness here
     silently sent that deployment to localhost instead. */
  /* Three valid shapes:
       "https://…" or ""   an API to use, "" meaning same origin
       false               no API at all, a static deployment. Skips the
                           request entirely rather than failing one per load
       undefined           fall back to DEFAULT_API_BASE                     */
  apiBase: QS.get("api")
        ?? (typeof window!=="undefined" && window.TRACKER_API_BASE===false
              ? null
              : typeof window!=="undefined" && typeof window.TRACKER_API_BASE==="string"
                  ? window.TRACKER_API_BASE
                  : DEFAULT_API_BASE),
  snapshotUrl: QS.get("data") || "./data/bootstrap.json",
  registry: { candidate: 280, main: 89, backup: 61, notRelevant: 130 },
  dataOrigin: "embedded",         // set by the loader to api | snapshot | embedded
  provenance: null                // populated from /api/provenance or computed locally
};


/* ===== 02-data-layer.js ===== */

/* ============================================================================
   DATA LAYER
   Bindings the whole UI reads from. They are `let`, not `const`, because the
   dataset is loaded at runtime and can be replaced (API, snapshot, admin
   upload) without a rebuild. applyDataset() is the single write point.
   ==========================================================================*/
let SOURCES={}, ORGS=[], ORG={}, SECTORS=[], SECTOR={}, DISTRICTS=[], PROVINCES=[], GEO_CONFIG={};
let DIMS=[], OUTPUTS=[], LADDER=[], TARGETS={readiness:70,maturity:60};
let INDICATOR_DEFS=[], OBSERVATIONS=[], IND=[], BYCODE={};
let JOURNEY=[], POLICIES=[], GLOSSARY=[], USECASES=[], CONTRIBUTIONS=[];
let ECON2022={}, L26={}, BENCH={}, RAIA={pillars:[],nationalTargets:[],sectorLadder:{sectors:[]},record:{}}, RECORD={useCases:[],institutions:[],enablers:[],taxonomy:{}}, ROADMAP={items:[],proposedComposites:[],externalIndicesToIngest:[]};
let YEARS=[];

/* Indicator records are assembled from two files, definitions and the
   observation series, so a new observation never requires touching a
   definition, and a definition change never rewrites history. */
function buildIndicators(){
  const byInd={};
  OBSERVATIONS.forEach(o=>{(byInd[o.indicator]=byInd[o.indicator]||[]).push(o)});
  IND = INDICATOR_DEFS.map(d=>{
    // An observation explicitly flagged "not_reported" is a stated absence,
    // not a value: it is kept for the audit trail but never scored.
    const all=(byInd[d.code]||[]).slice().sort((a,b)=>a.year-b.year);
    const obs=all.filter(o=>o.verification!=="not_reported"&&o.value!==null&&o.value!==undefined);
    const latest=obs.length?obs[obs.length-1]:null;
    const stale=latest?Math.max(0,META.cycle-latest.year):0;
    const current=obs.find(o=>o.year===META.cycle);
    const declaredAbsent=all.some(o=>o.year===META.cycle&&o.verification==="not_reported");
    return {
      code:d.code, name:d.name, output:d.output, dim:d.dimension, unit:d.unit,
      method:d.normalisation, pol:d.polarity==="negative"?"-":"+",
      baseline:d.baseline, target:d.target, universe:d.universe||172,
      mem:d.indexMembership==="maturity"?"M":"R",
      owner:d.reportingOrganisation, sourceId:d.sourceId,
      rel:d.relevance, acc:d.accessibility, origin:d.origin, gate:d.capabilityGate,
      evidenceType:d.evidenceType, note:d.note||"",
      definition:d.definition||null, methodology:d.methodology||null,
      geoLevel:d.geographicScope||"National", updateFrequency:d.updateFrequency||"annual",
      // Provenance travels with every observation. Dropping origin here made the
      // Data Explorer report every value as a demo value and silently broke the
      // data quality index, caught by the cross-engine parity test.
      obs:obs.map(o=>({year:o.year,value:o.value,collected:o.collectedOn,period:o.period,
                       origin:o.origin||"demo",verification:o.verification,sourceId:o.sourceId,
                       note:o.note||null})),
      stale, notReported: !current,
      verification: current?current.verification:"not_reported",
      declaredAbsent,
      weight:1, relWeight:d.relevance,
      lastUpdated: latest?(latest.collectedOn||latest.year+"-12-31"):", ",
      contributor: (SOURCES[d.sourceId]||{}).org || ", "
    };
  });
  BYCODE=Object.fromEntries(IND.map(i=>[i.code,i]));
}

/* How much of what is published is actually reported by a named source.
   Shown in the status bar rather than buried: a platform whose proposition is
   provenance has to be candid about its own. */
function computeProvenance(){
  const byOrigin={};
  OBSERVATIONS.forEach(o=>{const k=o.origin||"unclassified";byOrigin[k]=(byOrigin[k]||0)+1});
  const total=OBSERVATIONS.length||1;
  const srcs=Object.values(SOURCES);
  return {
    observations:{total:OBSERVATIONS.length,byOrigin,
      sourceReportedShare:(byOrigin["source-reported"]||0)/total},
    sources:{total:srcs.length,verified:srcs.filter(s=>s.verification==="verified").length}
  };
}
function applyDataset(ds){
  SOURCES=Object.fromEntries((ds.sources.items||[]).map(s=>[s.id,s]));
  ORGS=ds.organisations.items; ORG=Object.fromEntries(ORGS.map(o=>[o.id,o]));
  SECTORS=ds.sectors.items;     SECTOR=Object.fromEntries(SECTORS.map(s=>[s.id,s]));
  DISTRICTS=ds.geography.districts; PROVINCES=ds.geography.provinces; GEO_CONFIG=ds.geography.config;
  DIMS=ds.framework.dimensions.map(d=>({id:d.id,code:d.id,n:d.name,short:d.shortName,cls:d.class,
    color:d.color,obj:d.objective,why:d.rationale,outputs:d.outputs}));
  OUTPUTS=ds.framework.outputs.map(o=>({id:o.id,d:o.dimension,n:o.statement}));
  LADDER=ds.framework.maturityLadder.map(l=>({l:l.level,n:l.name,min:l.bandMin,max:l.bandMax,d:l.descriptor,
    gates:l.gates.map(g=>[g.indicator,g.label])}));
  TARGETS=ds.framework.targets||TARGETS;
  if(ds.framework.methodologyVersion)META.methodology=ds.framework.methodologyVersion;
  INDICATOR_DEFS=ds.indicators.items; OBSERVATIONS=ds.observations.items;
  JOURNEY=ds.journey.items; POLICIES=ds.policies.items; GLOSSARY=ds.glossary.items;
  USECASES=ds.useCases.items; CONTRIBUTIONS=ds.contributions.items;
  ECON2022=ds.economicSizing2022; L26=ds.landscape2026; BENCH=ds.benchmarks||{series:[],indexComparison:[]};
  ROADMAP=ds.proposedIndicators||ROADMAP;
  RAIA=ds.raiaPortfolio||RAIA;
  RECORD=ds.raiaRecord||RECORD;
  YEARS=[];for(let y=META.firstYear;y<=META.cycle;y++)YEARS.push(y);
  buildIndicators();
  META.provenance=computeProvenance();
}

/* Resolution order is deliberate: live service, then published snapshot, then
   the embedded copy. Each failure is reported, never silently swallowed. */
async function loadDataset(){
  const bundle=keys=>({sources:keys.sources,organisations:keys.organisations,sectors:keys.sectors,
    geography:keys.geography,framework:keys.framework,indicators:keys.indicators,observations:keys.observations,
    journey:keys.journey,policies:keys.policies,glossary:keys.glossary,useCases:keys.useCases,
    contributions:keys.contributions,economicSizing2022:keys.economicSizing2022,landscape2026:keys.landscape2026,
    benchmarks:keys.benchmarks,proposedIndicators:keys.proposedIndicators,raiaPortfolio:keys.raiaPortfolio,raiaRecord:keys.raiaRecord});
  if(META.apiBase!==null&&META.apiBase!==undefined){
    try{
      const r=await fetch(META.apiBase.replace(/\/$/,"")+"/api/bootstrap");
      if(r.ok){const j=await r.json();META.dataOrigin="api";return bundle(j)}
      console.warn("API responded",r.status,",  falling back to the published snapshot");
    }catch(e){console.warn("API unreachable:",e.message,",  falling back to the published snapshot")}
  }
  try{
    const r=await fetch(META.snapshotUrl);
    if(r.ok){const j=await r.json();META.dataOrigin="snapshot";return bundle(j)}
  }catch(e){/* expected when the file is opened directly from disk */}
  META.dataOrigin="embedded";
  return bundle(EMBEDDED_DATASET);
}


/* ===== 03-engine.js ===== */

/* ============================== SCORING ENGINE ==========================
   Unchanged methodology. The only differences from the previous build are
   that the indicator universe for rank normalisation is now per-indicator,
   and a missing observation in ANY year (not just the current cycle) is
   excluded from aggregation rather than assumed present.
   ======================================================================*/
function rng(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619)}
  return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
const clamp100=v=>Math.max(0,Math.min(100,v));
const clampv=(x,a,b)=>{const lo=Math.min(a,b),hi=Math.max(a,b);return Math.max(lo,Math.min(hi,x))};
function invert(p,I){const L=I.baseline,U=I.target;
  if(I.method==="log"){const a=Math.log(1+L),b=Math.log(1+U);return Math.exp(a+p*(b-a))-1}
  if(I.method==="rank")return Math.round(L+p*(U-L));
  return L+p*(U-L)}

function normalise(x,I){
  if(x===null||x===undefined||isNaN(x))return null;
  const L=I.baseline,U=I.target;
  switch(I.method){
    case "binary":return x?100:0;
    case "ordinal":return clamp100(x);
    case "passthrough":return clamp100(100*(x-L)/(U-L));
    case "rank":{const N=I.universe||172;return clamp100(100*(N-x+1)/N)}
    case "log":{const a=Math.log(1+L),b=Math.log(1+U);return clamp100(100*(Math.log(1+clampv(x,L,U))-a)/(b-a))}
    default:{const lo=Math.min(L,U),hi=Math.max(L,U);
      const v=(clampv(x,lo,hi)-lo)/(hi-lo);return clamp100(100*(U>=L?v:1-v))}
  }
}
function confidence(I,year){
  const S=(SOURCES[I.sourceId]||{reliability:.6}).reliability;
  const A={1:0.4,2:0.7,3:1.0}[I.acc];
  const age=(I.stale||0)+(META.cycle-year);
  const Rc=Math.exp(-0.35*Math.max(0,age));
  const V={verified:0.9,in_review:0.6,unverified:0.4,not_reported:0.2}[I.verification]||0.5;
  return Math.max(0,Math.min(1,0.30*S+0.20*A+0.25*Rc+0.25*V));
}
function aggregate(children){
  const all=children,WT=all.reduce((s,c)=>s+c.w,0)||1;
  const avail=all.filter(c=>c.assessed&&c.score!==null);
  const coverage=all.reduce((s,c)=>s+c.w*(c.coverage!==undefined?c.coverage:(c.assessed?1:0)),0)/WT;
  if(!avail.length)return{score:null,assessed:false,coverage:0,confidence:0,status:"insufficient"};
  const W=avail.reduce((s,c)=>s+c.w,0);
  const score=avail.reduce((s,c)=>s+c.w*c.score,0)/W;
  const conf=coverage*avail.reduce((s,c)=>s+c.w*c.confidence,0)/W;
  return{score,assessed:true,coverage,
    confidence:conf,status:coverage>=0.75?"published":coverage>=0.5?"provisional":"insufficient"};
}
function scoreAll(year,overrides){
  overrides=overrides||{};
  const iS={};
  IND.forEach(I=>{
    const o=I.obs.find(o=>o.year===year);
    // An indicator with no observation for this year is excluded from the
    // aggregate and lowers coverage. It is never treated as a zero.
    const missing=!o;
    let raw=o?o.value:null;
    if(overrides[I.code]!==undefined)raw=overrides[I.code];
    const s=missing?null:normalise(raw,I);
    const ok=!missing&&s!==null;
    iS[I.code]={code:I.code,raw,score:s,assessed:ok,coverage:ok?1:0,
      confidence:confidence(I,year-(I.stale||0)),w:1,I};
  });
  const oS={},dS={};
  OUTPUTS.forEach(O=>{oS[O.id]=Object.assign({id:O.id},aggregate(IND.filter(i=>i.output===O.id).map(i=>iS[i.code])),{w:1})});
  DIMS.forEach(D=>{dS[D.id]=Object.assign({id:D.id},aggregate(D.outputs.map(id=>oS[id])),{w:1})});
  function composite(mem){
    const per={};
    DIMS.forEach(D=>{
      const outs=D.outputs.map(oid=>{
        const m=IND.filter(i=>i.output===oid&&i.mem===mem);
        return Object.assign({id:oid},aggregate(m.map(i=>iS[i.code])),{w:m.length});
      }).filter(o=>o.w>0);
      per[D.id]=outs.length?Object.assign({id:D.id},aggregate(outs),{w:outs.reduce((s,o)=>s+o.w,0)})
                           :{id:D.id,score:null,assessed:false,coverage:0,confidence:0,w:0};
    });
    const dims=DIMS.map(D=>per[D.id]).filter(d=>d.w>0);
    const top=aggregate(dims);
    const av=dims.filter(x=>x.assessed&&x.score>0),tw=av.reduce((s,x)=>s+x.w,0)||1;
    const geo=av.length?Math.exp(av.reduce((s,x)=>s+x.w*Math.log(x.score),0)/tw):null;
    return Object.assign(top,{byDim:per,geometric:geo,balance:geo!==null?top.score-geo:null});
  }
  return {year,iS,oS,dS,readiness:composite("R"),maturity:composite("M")};
}
function gateOK(code,run){
  const s=run.iS[code];if(!s||s.raw===null)return false;
  const I=BYCODE[code];
  if(I.method==="binary")return s.raw>=1;
  if(I.method==="ordinal")return s.raw>=100;
  if(code==="RWA10")return s.raw>=10;
  if(code==="RWA9")return s.raw<=15;
  return (s.score||0)>=60;
}
function maturityLevel(run){
  const score=run.maturity.score||0;
  let band=1;LADDER.forEach(L=>{if(score>=L.min)band=L.l});
  let gate=1;const unmet=[];
  for(let i=1;i<LADDER.length;i++){
    const L=LADDER[i],bad=L.gates.filter(g=>!gateOK(g[0],run));
    if(!bad.length)gate=L.l;else{bad.forEach(b=>unmet.push({level:L.l,code:b[0],label:b[1]}));break}
  }
  const assigned=Math.min(band,gate);
  return {assigned,band,gate,unmet,def:LADDER[assigned-1],binding:gate<band?unmet.filter(u=>u.level===gate+1):[]};
}
let RUNS={};
/* YEAR is the reporting year the whole platform is currently showing. Moving it
   re-points RUN/PREV/ML, so every view, chart and drawer follows one control. */
let YEAR=META.cycle, RUN=null, PREV=null, ML=null;
function runEngine(){
  RUNS={};YEARS.forEach(y=>RUNS[y]=scoreAll(y));
  bindYear(YEAR);
}
function bindYear(y){
  YEAR=Math.max(META.firstYear,Math.min(META.cycle,y));
  RUN=RUNS[YEAR];PREV=RUNS[Math.max(META.firstYear,YEAR-1)];ML=maturityLevel(RUN);
  if(typeof DB!=="undefined"){DB.RUN=RUN;DB.PREV=PREV;DB.ML=ML;DB.YEAR=YEAR}
}


/* ---------------------------------------------------------------- data quality
   A composite of how well a dimension is *measured*, as distinct from how well
   Rwanda is *doing*. No national AI index publishes this, and it is the most
   defensible differentiator the platform has: a score of 60 on 95% coverage
   with verified sources is a different claim from 60 on 55% coverage of
   estimates, and today those two look identical.
   ---------------------------------------------------------------------------*/
function dataQuality(dimId,year){
  year=year||YEAR;
  const run=RUNS[year]||RUN;
  const inds=IND.filter(i=>!dimId||i.dim===dimId);
  if(!inds.length)return null;
  const s=inds.map(i=>run.iS[i.code]);
  const assessed=s.filter(x=>x.assessed);
  const coverage=assessed.length/inds.length;
  const confidence=assessed.length?assessed.reduce((a,x)=>a+x.confidence,0)/assessed.length:0;
  const verified=inds.filter(i=>i.verification==="verified").length/inds.length;
  const reported=inds.filter(i=>{const o=i.obs.find(o=>o.year===year);
    return o&&(o.origin||"demo")==="source-reported"}).length/inds.length;
  // Equal weights: each answers a different question and none dominates.
  const score=100*(0.30*coverage+0.30*confidence+0.20*verified+0.20*reported);
  return {score,coverage,confidence,verified,sourceReported:reported,
    band:score>=75?"strong":score>=55?"adequate":score>=40?"weak":"poor"};
}


/* ===== 04-api-client.js ===== */
/* ====================== SERVICE LAYER (the "API") =========================
   Every view resolves data through here. Point META.apiBase at the backend and
   the same calls hit the live service; nothing in the views changes.        */
let DB={};
function bindDB(){
  DB={META,SOURCES,ORGS,ORG,SECTORS,SECTOR,DISTRICTS,PROVINCES,GEO_CONFIG,ECON2022,L26,
    DIMS,OUTPUTS,IND,BYCODE,JOURNEY,POLICIES,GLOSSARY,USECASES,CONTRIBUTIONS,LADDER,BENCH,ROADMAP,RAIA,RECORD,
    RUNS,RUN,PREV,ML,TARGETS,YEARS,YEAR};
}
const AUDIT=[];
function logAudit(action,entity,before,after){
  AUDIT.unshift({t:new Date().toISOString().replace("T"," ").slice(0,19),actor:SESSION.user,role:SESSION.role,
    action,entity,before,after});
}
const api=(function(){
  const remote=async(path)=>{
    if(!META.apiBase)return null;
    try{const r=await fetch(META.apiBase+path);if(r.ok)return await r.json()}catch(e){}
    return null;
  };
  const local=v=>Promise.resolve(v);
  return {
    async meta(){return (await remote("/api/meta"))||META},
    async framework(){return (await remote("/api/framework"))||{dimensions:DIMS,outputs:OUTPUTS,ladder:LADDER}},
    async indicators(f){
      const r=await remote("/api/indicators");let rows=r||IND;
      if(f){
        if(f.q){const q=f.q.toLowerCase();rows=rows.filter(i=>(i.code+" "+i.name+" "+i.sourceId+" "+i.owner).toLowerCase().includes(q))}
        if(f.dim)rows=rows.filter(i=>i.dim===f.dim);
        if(f.output)rows=rows.filter(i=>i.output===f.output);
        if(f.mem)rows=rows.filter(i=>i.mem===f.mem);
        if(f.source)rows=rows.filter(i=>i.sourceId===f.source);
        if(f.org)rows=rows.filter(i=>i.owner===f.org);
        if(f.evidence)rows=rows.filter(i=>i.evidenceType===f.evidence);
        if(f.status)rows=rows.filter(i=>i.verification===f.status);
      }
      return rows;
    },
    async indicator(code){return (await remote("/api/indicators/"+code))||BYCODE[code]},
    async observations(code,year){const I=BYCODE[code];
      return year?I.obs.filter(o=>o.year===year):I.obs},
    async scores(year){return RUNS[year||META.cycle]},
    async readiness(){return RUN.readiness},
    async maturity(){return {index:RUN.maturity,level:ML}},
    async trend(code){return YEARS.map(y=>({year:y,raw:RUNS[y].iS[code].raw,score:RUNS[y].iS[code].score,
      assessed:RUNS[y].iS[code].assessed,confidence:RUNS[y].iS[code].confidence}))},
    async econ(){return (await remote("/api/economic-sizing"))||ECON2022},
    async landscape(){return (await remote("/api/landscape/2026"))||L26},
    async benchmarks(){return (await remote("/api/benchmarks"))||BENCH},
    async roadmap(){return (await remote("/api/proposed-indicators"))||ROADMAP},
    async raia(){return (await remote("/api/raia-portfolio"))||RAIA},
    async record(){return (await remote("/api/raia-record"))||RECORD},
    async useCases(f){let r=(await remote("/api/use-cases"))||USECASES;
      if(f&&f.sector)r=r.filter(u=>u.sector===f.sector);
      if(f&&f.district)r=r.filter(u=>u.district===f.district);
      if(f&&f.publishedOnly)r=r.filter(u=>u.status==="verified");
      return r},
    async orgs(f){let r=(await remote("/api/organisations"))||ORGS;
      if(f&&f.type)r=r.filter(o=>o.type===f.type);return r},
    async districts(){return (await remote("/api/geography"))||DISTRICTS},
    async policies(){return (await remote("/api/policies"))||POLICIES},
    async journey(){return (await remote("/api/journey"))||JOURNEY},
    async sources(){return (await remote("/api/sources"))||Object.values(SOURCES)},
    async contributions(){return (await remote("/api/contributions"))||CONTRIBUTIONS},
    async glossary(){return GLOSSARY},
    async audit(){return AUDIT},
    /* writes, admin only, RBAC enforced */
    async updateObservation(code,year,value,reason){
      requireRole(["Data Administrator","Platform Administrator"]);
      const I=BYCODE[code],o=I.obs.find(o=>o.year===year);
      const before=o?o.value:null;
      if(o)o.value=value;else I.obs.push({year,value,collected:new Date().toISOString().slice(0,10),period:String(year)});
      // keep the underlying observation store in step with the derived record
      const rec=OBSERVATIONS.find(x=>x.indicator===code&&x.year===year);
      if(rec)rec.value=value;else OBSERVATIONS.push({indicator:code,period:String(year),year,value,
        collectedOn:new Date().toISOString().slice(0,10),sourceId:I.sourceId,verification:"in_review",staleCycles:0});
      I.verification="in_review";I.notReported=false;I.lastUpdated=new Date().toISOString().slice(0,10);
      recompute();logAudit("OBSERVATION_UPDATED",code+"/"+year,before,value+(reason?". "+reason:""));
      return {ok:true};
    },
    async setVerification(code,state){
      requireRole(["Data Reviewer","Data Administrator","Platform Administrator"]);
      const I=BYCODE[code],before=I.verification;I.verification=state;
      recompute();logAudit("VERIFICATION_CHANGED",code,before,state);return {ok:true};
    },
    async addContribution(rec){
      CONTRIBUTIONS.unshift(Object.assign({id:"C-"+(1043+CONTRIBUTIONS.length),when:new Date().toISOString().slice(0,10),
        state:"Awaiting review",reviewer:", "},rec));
      logAudit("CONTRIBUTION_SUBMITTED",rec.target||"new",null,rec.value);return {ok:true};
    },
    async loadDataset(json){
      requireRole(["Data Administrator","Platform Administrator"]);
      let n=0;
      (json.observations||[]).forEach(r=>{
        const I=BYCODE[r.code];if(!I)return;
        const o=I.obs.find(o=>o.year===r.year);
        if(o)o.value=r.value;else I.obs.push({year:r.year,value:r.value,collected:r.collected||"",period:String(r.year)});
        if(r.verification)I.verification=r.verification;
        I.notReported=false;n++;
      });
      recompute();logAudit("DATASET_LOADED","observations",null,n+" observations");return {ok:true,applied:n};
    }
  };
})();
function recompute(){
  YEARS.forEach(y=>RUNS[y]=scoreAll(y));

}

  const d=$("#drawer");

let VIEW="overview";
const VIEWS={},MOUNT={};

/* ------------------------------------------------------------------ routing
   The view, reporting year, cross-filters and any open indicator live in the
   URL. Without this a policymaker cannot send a colleague "the 2023 view of D5
   filtered to agriculture", cannot bookmark it, and the back button does
   nothing, on a platform whose output is citations in policy papers.
   Shape:  #/readiness?year=2023&sector=AGR&indicator=RWA10
   -------------------------------------------------------------------------*/
let SUPPRESS_ROUTE=false;
function currentRoute(){
  const p=new URLSearchParams();
  if(YEAR!==META.cycle)p.set("year",YEAR);
  if(typeof FILTER!=="undefined"){
    if(FILTER.sector)p.set("sector",FILTER.sector);
    if(FILTER.dim)p.set("dim",FILTER.dim);
  }
  const q=p.toString();
  return "#/"+VIEW+(q?"?"+q:"");
}
function syncRoute(replace){
  if(SUPPRESS_ROUTE)return;
  const url=currentRoute();
  if(location.hash===url)return;
  history[replace?"replaceState":"pushState"]({view:VIEW},"",url);
}
function parseRoute(){
  const raw=(location.hash||"").replace(/^#\/?/,"");
  const [view,query]=raw.split("?");
  const p=new URLSearchParams(query||"");
  return {view:view||"overview",year:p.get("year"),sector:p.get("sector"),
          dim:p.get("dim"),indicator:p.get("indicator")};
}
async function applyRoute(){
  const r=parseRoute();
  SUPPRESS_ROUTE=true;
  if(r.year&&+r.year!==YEAR)bindYear(+r.year);
  if(typeof FILTER!=="undefined"){FILTER.sector=r.sector||null;FILTER.dim=r.dim||null}
  await go(r.view);
  SUPPRESS_ROUTE=false;
  if(r.indicator&&BYCODE[r.indicator])indDrawer(r.indicator);
}
window.addEventListener("popstate",()=>{applyRoute()});

async function go(v){
  if(!VIEWS[v])v="overview";
  VIEW=v;killCharts();closeDrawer();
  $("#main").innerHTML=skeleton();
  const html=await VIEWS[v]();
  $("#main").innerHTML=(typeof filterBar==="function"?filterBar():"")+html;
  window.scrollTo({top:0,behavior:"instant"});
  renderNav();renderFresh();
  if(typeof makeActionablesFocusable==="function")makeActionablesFocusable($("#main"));
  if(typeof animateCounters==="function")animateCounters();
  if(MOUNT[v])await MOUNT[v]();
  if(typeof registerChartTables==="function")registerChartTables();
  syncRoute();
}

/* animated counters */
function countUp(el,to,decimals,prefix,suffix){
  const from=0,dur=620,t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),v=from+(to-from)*e;
    el.textContent=(prefix||"")+v.toLocaleString("en-US",{minimumFractionDigits:decimals,maximumFractionDigits:decimals})+(suffix||"");
    if(k<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function animateCounters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const to=parseFloat(el.getAttribute("data-count"));
    if(isNaN(to))return;
    countUp(el,to,+(el.getAttribute("data-dec")||0),el.getAttribute("data-pre")||"",el.getAttribute("data-suf")||"");
  });
}

(function(){
  let tip;
  document.addEventListener("mouseover",e=>{
    const el=e.target.closest?e.target.closest("[data-tip]"):null;
    if(!el)return;
    tip=document.getElementById("tip");if(!tip)return;
    tip.textContent=el.getAttribute("data-tip");tip.classList.add("on");
    const r=el.getBoundingClientRect();
    tip.style.left=Math.min(window.innerWidth-340,Math.max(10,r.left))+"px";
    tip.style.top=(r.bottom+9)+"px";
  });
  document.addEventListener("mouseout",e=>{
    if(e.target.closest&&e.target.closest("[data-tip]")){const t=document.getElementById("tip");if(t)t.classList.remove("on")}
  });

let CMD={items:[],sel:0};
function palIndex(){
  const out=NAV.map(([id,n])=>({k:"Page",t:n,s:"",go:()=>go(id)}));
  IND.forEach(i=>out.push({k:"Indicator",t:i.code+" · "+i.name,s:DIMS.find(d=>d.id===i.dim).short,go:()=>indDrawer(i.code)}));
  DIMS.forEach(d=>out.push({k:"Dimension",t:d.id+" · "+d.n,s:d.cls,go:()=>dimDrawer(d.id)}));
  SECTORS.forEach(s=>out.push({k:"Sector",t:s.name,s:"",go:()=>sectorDrawer(s.id)}));
  ORGS.forEach(o=>out.push({k:"Organisation",t:o.name,s:o.type,go:()=>orgDrawer(o.id)}));
  Object.values(SOURCES).forEach(s=>out.push({k:"Source",t:s.name,s:s.org,go:()=>sourceDrawer(s.id)}));
  USECASES.forEach(u=>out.push({k:"Use case",t:u.name,s:SECTOR[u.sector].name,go:()=>ucDrawer(u.id)}));
  ECON2022.lighthouse.forEach(l=>out.push({k:"Lighthouse",t:l.name,s:"$"+l.lowMn+"–"+l.highMn+"m · 2022",go:()=>lighthouseDrawer(l.id)}));
  return out;
}
function openPalette(){
  CMD.items=palIndex();CMD.sel=0;
  const p=document.getElementById("pal");p.classList.add("on");
  const q=document.getElementById("palq");q.value="";q.focus();palSearch();
}
function closePalette(){document.getElementById("pal").classList.remove("on")}
function palSearch(){
  const q=(document.getElementById("palq").value||"").toLowerCase().trim();
  const res=(q?CMD.items.filter(i=>(i.t+" "+i.k+" "+i.s).toLowerCase().includes(q)):CMD.items.filter(i=>i.k==="Page")).slice(0,40);
  CMD.res=res;CMD.sel=0;
  document.getElementById("palres").innerHTML=res.length?res.map((i,n)=>
    `<div class="palitem ${n===0?"sel":""}" data-n="${n}" data-act="paletteGo" data-args="${n}">
      <span class="pk">${i.k}</span><span class="pt">${esc(i.t)}</span><span class="ps">${esc(i.s)}</span></div>`).join("")
    :`<div class="palitem"><span class="pt muted">Nothing matches “${esc(q)}”. Try an indicator code, a sector or an organisation.</span></div>`;
}
function palGo(n){const i=CMD.res[n];if(!i)return;closePalette();i.go()}
function palKey(e){
  if(e.key==="Escape")return closePalette();
  if(!CMD.res||!CMD.res.length)return;
  if(e.key==="Enter"){e.preventDefault();return palGo(CMD.sel)}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    CMD.sel=(CMD.sel+(e.key==="ArrowDown"?1:-1)+CMD.res.length)%CMD.res.length;
    document.querySelectorAll(".palitem").forEach(el=>el.classList.toggle("sel",+el.dataset.n===CMD.sel));
    const el=document.querySelector(".palitem.sel");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"});
  }
}
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette()}
  if(e.key==="Escape")closePalette();
});

/* ==================== CHARTS AS TABLES ==================================
   Every chart carries a text alternative. This is the accessibility fix, a
   canvas is invisible to a screen reader, but it also serves two other
   audiences the platform names: analysts who want the numbers, and users on
   the low-bandwidth connections that 34% smartphone ownership implies.
   ======================================================================= */
const CHART_TABLES = {};

/** Register the data behind a chart so it can be rendered as a table. */
function chartTable(id, caption, headers, rows) {
  CHART_TABLES[id] = { caption, headers, rows };
}

function registerChartTables() {
  document.querySelectorAll("[data-chart-id]").forEach(el => {
    const id = el.getAttribute("data-chart-id");
    if (!CHART_TABLES[id] || el.querySelector(".chartswap")) return;
    const swap = document.createElement("div");
    swap.className = "chartswap";
    swap.innerHTML = `<button class="btn sm" data-act="chartTable" data-args="${id}"
      aria-controls="${id}-table" aria-expanded="false">View as table</button>`;
    el.parentNode.insertBefore(swap, el.nextSibling);
    makeActionablesFocusable(swap);
  });
}

function toggleChartTable(id) {
  const chart = document.querySelector(`[data-chart-id="${id}"]`);
  const data = CHART_TABLES[id];
  if (!chart || !data) return;
  const existing = document.getElementById(id + "-table");
  const button = document.querySelector(`[data-act="chartTable"][data-args="${id}"]`);

  if (existing) {
    existing.remove();
    chart.style.display = "";
    button.textContent = "View as table";
    button.setAttribute("aria-expanded", "false");
    return;
  }
  const wrap = document.createElement("div");
  wrap.id = id + "-table";
  wrap.style.padding = "0 12px 12px";
  wrap.innerHTML = `<table class="charttable">
    <caption class="visually-hidden">${esc(data.caption)}</caption>
    <thead><tr>${data.headers.map(h =>
      `<th scope="col"${typeof h === "object" && h.n ? ' class="n"' : ""}>${esc(typeof h === "object" ? h.label : h)}</th>`).join("")}</tr></thead>
    <tbody>${data.rows.map(r => `<tr>${r.map((c, i) =>
      `<td${typeof data.headers[i] === "object" && data.headers[i].n ? ' class="n"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  chart.style.display = "none";
  chart.parentNode.insertBefore(wrap, chart.nextSibling);
  button.textContent = "View as chart";
  button.setAttribute("aria-expanded", "true");
  wrap.setAttribute("tabindex", "-1");
  wrap.focus();
}

/* Charts are decorative to assistive technology once a table alternative
   exists, so they are hidden from the accessibility tree rather than
   announced as an unlabelled image. */
function markChartAccessible(el, id, label) {
  if (!el) return;
  el.setAttribute("data-chart-id", id);
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", label);
}


/* ===== 07-actions.js ===== */

/* ===================== DELEGATED ACTION LAYER ==========================
   Every interactive element declares what it does with data-act / data-args
   instead of an inline handler. Three things follow:

     · a strict Content-Security-Policy becomes possible, there is no inline
       script left to allow;
     · anything clickable is automatically keyboard-operable, because one
       handler applies Enter and Space uniformly;
     · interactions are testable by selector rather than by evaluating a string.

   Args are pipe-separated because they are always short identifiers, an
   indicator code, a view key, a dimension id.
   ====================================================================== */
const ACTIONS = {
  /* navigation */
  go:            ([view]) => go(view),
  closeDrawer:   () => closeDrawer(),
  closeAndGo:    ([view]) => { closeDrawer(); go(view); },
  closeAndContribute: ([kind]) => { closeDrawer(); openContribute(kind || undefined); },

  /* drawers */
  indicator:     ([code]) => indDrawer(code),
  dimension:     ([id])   => dimDrawer(id),
  source:        ([id])   => sourceDrawer(id),
  useCase:       ([id])   => ucDrawer(id),
  sector:        ([id])   => sectorDrawer(id),
  organisation:  ([id])   => orgDrawer(id),
  district:      ([code]) => districtDrawer(code),
  policy:        ([i])    => policyDrawer(+i),
  pillar:        ([slug]) => pillarDrawer(slug),
  lighthouse:    ([id])   => lighthouseDrawer(id),
  benchmark:     ([id])   => benchDrawer(id),
  insight:       ([n])    => insightDrawer(+n),
  ladder:        () => ladderDrawer(),
  roadmap:       ([domain]) => roadmapDrawer(domain),
  mapCredit:     () => mapCreditDrawer(),
  contribute:    ([kind]) => openContribute(kind || undefined),

  /* state */
  filter:        ([key, value]) => setFilter(key, value),
  clearFilters:  () => clearFilters(),
  resetAll:      () => { clearFilters(); setYear(META.cycle); },
  setYear:       ([y]) => setYear(+y),
  geoLevel:      ([level]) => { GEO_STATE.level = level; go("geo"); },
  exView:        ([view]) => { EX.view = view; go("explorer"); },
  exReset:       () => { EX = { q:"", dim:"", sector:"", source:"", org:"", evidence:"",
                                status:"", origin:"", year: META.cycle, view: EX.view,
                                sort:"code", dir:1 }; go("explorer"); },
  exSort:        ([key]) => exSort(key),
  showDemoValues: () => { go("explorer").then(() => { EX.origin = "demo"; exRefresh(); }); },

  /* form controls, declared the same way as clicks, so one policy covers both */
  exQuery:       (_a, el) => { EX.q = el.value; exRefresh(); },
  exSet:         ([key], el) => { EX[key] = key === "year" ? +el.value : el.value; exRefresh(); },
  yearPreview:   (_a, el) => { const l = document.getElementById("yearLab"); if (l) l.textContent = el.value; },
  setYearFromInput: (_a, el) => setYear(+el.value),
  geoMetric:     (_a, el) => { GEO_STATE.metric = el.value; MOUNT.geo(); },
  geoFile:       (_a, el) => loadGeoFile(el),
  paletteSearch: () => palSearch(),
  paletteKey:    (_a, _el, ev) => palKey(ev),
  evidenceFilter:(_a, el) => filterEv(el.value),

  /* charts and tables */
  chartTable:    ([id]) => toggleChartTable(id),
  togglePeer:    ([iso]) => togglePeer(iso),

  /* admin */
  signIn:        () => signIn(),
  signOut:       () => signOut(),
  applyEdit:     () => doEdit(),
  loadDataset:   () => doLoad(),
  verify:        ([code, state]) => doVerify(code, state),
  loadGeoFile:   () => document.getElementById("geoFile")?.click(),
  exportCSV:     () => exportCSV(),
  exportJSON:    () => exportJSON(),
  openPalette:   () => openPalette(),
  paletteGo:     ([n]) => palGo(+n),
  toggleLang:    () => setLang(LANG === "en" ? "rw" : "en"),
  toggleTheme:   () => toggleTheme(),
  setLang:       ([l]) => setLang(l),
  note:          ([msg]) => toast(msg)
};

function runAction(el, event) {
  const name = el.getAttribute("data-act");
  const fn = ACTIONS[name];
  if (!fn) { console.warn("Unknown action:", name); return; }
  event?.preventDefault();
  event?.stopPropagation();
  const raw = el.getAttribute("data-args");
  fn(raw ? raw.split("|") : [], el, event);
}

// Input, change and keydown are delegated the same way clicks are, so no form
// control needs an inline attribute either.
["input", "change", "keydown"].forEach(type => {
  document.addEventListener(type, e => {
    const el = e.target.closest?.(`[data-act][data-on="${type}"]`);
    if (el) {
      const fn = ACTIONS[el.getAttribute("data-act")];
      if (fn) fn((el.getAttribute("data-args") || "").split("|").filter(Boolean), el, e);
    }
  }, true);
});

document.addEventListener("click", e => {
  const el = e.target.closest?.("[data-act]:not([data-on])");
  if (el) runAction(el, e);
});

// Enter and Space activate anything actionable, so keyboard users reach every
// control without a separate code path.
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest?.("[data-act]:not([data-on])");
  if (!el || ["BUTTON", "A", "INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
  runAction(el, e);
});

/* Elements that are not natively focusable still have to be reachable. This
   runs after every render rather than being written into 100+ templates. */
function makeActionablesFocusable(root) {
  (root || document).querySelectorAll("[data-act]:not([data-on])").forEach(el => {
    if (["BUTTON", "A", "INPUT", "SELECT", "TEXTAREA"].includes(el.tagName)) return;
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
    if (!el.hasAttribute("role")) el.setAttribute("role", el.tagName === "TR" ? "row" : "button");
  });
}


/* ===== 08-runtime.js ===== */

/* ======================== RUNTIME DEPENDENCIES =========================
   The dashboard is a single portable file. Anything it loads from outside
   itself is therefore optional and every failure is tolerated:

     · app-config.js, deployment settings. Absent when the file is opened
                        from disk, which is fine: the defaults apply.
     · echarts, the charting library. Tried locally first, then from
                        the CDN. If neither resolves the dashboard renders
                        every chart as its table alternative instead.

   Loading these with static script tags meant the page depended on files
   that cannot exist under file://, and a blocked or missing script took the
   whole application with it.
   ====================================================================== */
function loadScript(src, { optional = true } = {}) {
  return new Promise(resolve => {
    const el = document.createElement("script");
    el.src = src;
    el.async = false;
    el.onload = () => resolve(true);
    el.onerror = () => {
      if (!optional) console.warn("Could not load", src);
      resolve(false);
    };
    (document.head || document.documentElement).appendChild(el);
  });
}

/** Deployment settings, if this build is being served rather than opened. */
async function loadDeploymentConfig() {
  const ok = await loadScript("./app-config.js");
  if (!ok) return false;
  if (typeof window.TRACKER_API_BASE === "string") META.apiBase = window.TRACKER_API_BASE;
  else if (window.TRACKER_API_BASE === false) META.apiBase = null;   // static deployment
  return true;
}

const ECHARTS_VERSION = "5.4.3";
const ECHARTS_CDN = `https://cdnjs.cloudflare.com/ajax/libs/echarts/${ECHARTS_VERSION}/echarts.min.js`;

/**
 * Vendored copy first, CDN second, neither third.
 * A government analytics tool should not stop working because a third party is
 * unreachable, and it should not silently depend on one either.
 */
async function ensureCharts() {
  if (typeof echarts !== "undefined") return "already-loaded";
  if (await loadScript("./vendor/echarts.min.js")) return "vendored";
  if (await loadScript(ECHARTS_CDN)) return "cdn";
  console.warn("Charting library unavailable, figures will be rendered as tables.");
  return "unavailable";
}

const chartsAvailable = () => typeof echarts !== "undefined";

    why:"The register indicator moves from 0 to 50 rather than to 100. RAIA's record carries sector and stage, not risk classification, oversight arrangements or routes to redress: Rwanda now publishes what it deploys, not how those systems are governed.",
    goto:"policy"});
  if(L26&&L26.governanceGaps)out.push({kind:"Cheap to close",tone:"a",
    text:`${L26.governanceGaps.missing.length} governance instruments are absent. AI legislation, a public register of state AI, evaluation capability, a procurement standard and a model ownership term.`,
    why:L26.governanceGaps.closingNote,goto:"policy"});
  const stale=IND.filter(i=>i.stale>0||i.notReported);
  out.push({kind:"Data signal",tone:"a",
    text:`${stale.length} indicators are stale or unreported, concentrated in private-sector and public-adoption measurement.`,
    why:`The 2022 assessment found accessibility good for third-party sources and poor for exactly the Rwanda-specific indicators that measure real adoption. That pattern persists.`,
    goto:"explorer"});
  return out;
}

function ladderDrawer(){
  openDrawer("AI maturity ladder","Assigned level = min(score band, capability gate)",
    LADDER.map(L=>{const unmet=L.gates.filter(g=>!gateOK(g[0],RUN));
      const state=L.l<ML.assigned?"passed":L.l===ML.assigned?"current":"not reached";
      return `<div class="card" style="margin-bottom:10px"><div class="bd">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <div><b style="font-size:15px">L${L.l} · ${L.n}</b>
            <span class="tag ${state==="current"?"b":state==="passed"?"g":""}" style="margin-left:6px">${state}</span></div>
          <span class="mono muted">${L.min}–${L.max}</span></div>
        <div class="small muted" style="margin-top:5px">${esc(L.d)}</div>
        ${L.gates.length?`<div style="margin-top:9px">${L.gates.map(g=>{const ok=gateOK(g[0],RUN);
          return `<div class="kv" style="cursor:pointer" data-act="indicator" data-args="${g[0]}">
            <span class="k">${ok?'<span style="color:var(--green)">✔</span>':'<span style="color:var(--red)">✗</span>'} ${esc(g[1])}</span>

}

function opportunityMatrix(){
  const maxUC=Math.max.apply(null,SECTORS.map(s=>USECASES.filter(u=>u.sector===s.id&&u.status==="verified").length))||1;
  return ECON2022.sectors.filter(s=>s.sector!=="OTH").map(s=>{
    const uc=USECASES.filter(u=>u.sector===s.sector&&u.status==="verified").length;
    const opportunity=s.shareSectorGDP;                 // % of sector GDP. 2022 estimate
    const gap=100*(1-uc/maxUC);                         // adoption gap proxy
    const priority=(opportunity/27)*0.5+(gap/100)*0.5;
    return {id:s.sector,name:SECTOR[s.sector].name,valueMn:s.valueMn,opportunity,gap,uc,priority,driver:s.driver};
  }).sort((a,b)=>b.priority-a.priority);
}

let GEO_STATE={loaded:false,geojson:null,metric:"usecases",attempted:false,level:"district",selected:null};

/* ---------------------------------------------------------------------------
   RwandaMap, an adapter of knowbee/react-rwanda-map (MIT, Igwaneza Bruce).
   The library's contract is preserved: selectedColor, defaultColor,
   strokeColor, nameColor, height, scale, position and an onSelect callback,
   with hover tooltips and click-to-select.
   Two deliberate departures:
     · it renders from GeoJSON supplied at runtime rather than from baked-in
       paths, because this platform must not ship approximated national
       borders, see the note rendered beneath the map;
     · it supports district level as well as province level, because every
       record in this platform is districted and the library is province-only.
   --------------------------------------------------------------------------- */
function RwandaMap(el, opts){
  if(!el) return null;
  const o = Object.assign({
    geojson:null, values:[], level:"district",
    defaultColor:cssVar("--chip"), selectedColor:PAL[0], strokeColor:cssVar("--line2"),
    nameColor:cssVar("--txt2"), height:460, scale:1, position:{x:50,y:50},
    label:"value", onSelect:()=>{}
  }, opts||{});

  const max = Math.max(1..o.values.map(v=>v.value||0));
  const mapName = "rwanda-"+o.level;
  echarts.registerMap(mapName, o.geojson);

  const chart = ec(el, {
    tooltip:{trigger:"item", formatter:p=>{
      const v = o.values.find(x=>x.name===p.name);
      if(!v) return `<b>${p.name}</b><br><span style="color:${cssVar("--mut")}">no record</span>`;
      return `<b>${p.name}</b><br>${o.label}: <b>${v.value}</b>`
        + (v.sub?`<br><span style="font-size:11px;color:${cssVar("--mut")}">${v.sub}</span>`:"");
    }},
    visualMap:{ min:0, max, left:14, bottom:14, calculable:false,
      inRange:{ color:[o.defaultColor, o.selectedColor] },
      textStyle:{ color:cssVar("--ec-axis"), fontSize:10.5 },
      text:["more","none"] },
    series:[{
      type:"map", map:mapName, roam:true, zoom:o.scale,
      layoutCenter:[o.position.x+"%", o.position.y+"%"], layoutSize:"96%",
      itemStyle:{ areaColor:o.defaultColor, borderColor:o.strokeColor, borderWidth:0.9 },
      emphasis:{ label:{show:true, color:o.nameColor, fontSize:11},
                 itemStyle:{ areaColor:o.selectedColor, borderColor:cssVar("--brand"), borderWidth:1.6 } },
      select:{ itemStyle:{ areaColor:o.selectedColor, borderColor:cssVar("--brand"), borderWidth:2 },
               label:{show:true, color:o.nameColor} },
      selectedMode:"single",
      label:{ show:false },
      data:o.values
    }]
  }, o.height);

  if(chart) chart.on("click", p=>{ GEO_STATE.selected=p.name; o.onSelect(p.name); });
  return chart;
}

  if(GEO_STATE.loaded&&GEO_STATE.geojson){
    let values;

        const v=ds.reduce((s,d)=>s+dVal(d),0);
        return {name:p,value:v,sub:ds.length+" districts"};

        itemStyle:{color:p=>p.data.v>0?PAL[0]:cssVar("--line2"),opacity:.9},
        label:{show:true,position:"right",formatter:p=>p.data.v>0?p.data.name:"",color:cssVar("--ec-axis"),fontSize:10}}]},460)
      .on("click",p=>{if(p.data&&p.data.code)districtDrawer(p.data.code)});
    note.innerHTML=`<span class="tag a">Boundary file not loaded</span>
      <span class="small muted">Plotting district centroids, every point is clickable. The map will not draw an approximated national or district boundary, because an approximate border is worse than none.
      Supply official GeoJSON at <span class="mono">${esc(GEO_CONFIG.boundarySources[0])}</span> or use <b>Load boundary file</b> above; the choropleth then renders immediately. Expected: ${esc(GEO_CONFIG.expected)}.</span>
      <div class="small muted" style="margin-top:6px">Map component adapted from

  }

async function tryLoadBoundaries(){
  for(const u of GEO_CONFIG.boundarySources){
    try{const r=await fetch(u);if(r.ok){const j=await r.json();
      if(j&&j.type){GEO_STATE.geojson=j;GEO_STATE.loaded=true;return true}}}catch(e){}
  }
  return false;
}
function loadGeoFile(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);
    if(!j.type||!(j.features||j.geometries))throw new Error("Not a GeoJSON FeatureCollection");
    GEO_STATE.geojson=j;GEO_STATE.loaded=true;toast("Boundaries loaded. "+(j.features?j.features.length:0)+" features");MOUNT.geo();
  }catch(e){toast("Could not read that file: "+e.message)}};
  rd.readAsText(f);
}

     ${kpi("Skills dimension score",fmt(d.score),`${deltaHtml(d.score,PREV.dS.D1.score," pts")} · coverage ${pct(d.coverage)}`,scColor(d.score))}

   <div class="row" style="grid-template-columns:1.3fr 1fr">
     ${cardF("Talent pipeline over time","normalised scores, all skills indicators",`<div id="tlChart" style="height:320px"></div>`)}
     ${card("The pipeline problem","evidence from the 2022 assessment",
       `<div class="prose">
         <p>The first-round assessment found <b>science graduates per capita declining from 2016 to 2019</b>, with STEM graduates down 44% by tally and 48% per capita over the same period, a steeper real decline once 2.5% annual population growth is accounted for.</p>
         <p>Against that, <b>AI postgraduates numbered 45 in 2022</b>, about 0.5% of 2019 STEM graduates, which the assessment read as limited awareness of AI opportunities among students.</p>
         <p>The encouraging counter-signal is informal: GitHub commits rose <b>over 400% between 2018 and 2019</b> and kept climbing, and AI papers co-authored with Rwandan researchers more than doubled from 63 to 143 between 2019 and 2020. Capability is forming outside the formal education system faster than inside it.</p>
        </div>${srcLine("AIRM22")}`)}
   </div>
   <div class="row" style="grid-template-columns:1fr">
     ${card("How many officials have been trained in AI? Three sources, three answers",
       "an unresolved definitional conflict, published rather than resolved",
      `<div class="prose"><p>This is the clearest example on the platform of why a number without a definition is
        not a measurement. Three credible sources report the same apparent quantity and differ by more than three
        orders of magnitude.</p></div>
       <table class="dt" style="margin:10px 0"><thead><tr><th>Source</th><th class="n">Figure</th><th>What it appears to count</th><th class="n">Year</th></tr></thead><tbody>
        <tr data-act="indicator" data-args="RAIA-OFFICIALS-AI"><td><b>RAIA national AI catalogue</b></td>
          <td class="n mono">134,000+</td><td class="small muted">Government officials reached by AI training of unstated depth</td><td class="n mono">2026</td></tr>
        <tr data-act="indicator" data-args="RWA8"><td><b>2022 national readiness assessment</b></td>
          <td class="n mono">41</td><td class="small muted">Civil servants completing AI policy or regulatory training</td><td class="n mono">2022</td></tr>
        <tr data-act="source" data-args="LANDSCAPE26"><td><b>2026 independent landscape review</b></td>
          <td class="n mono">50</td><td class="small muted">Civil servants across 24 institutions, national AI literacy programme</td><td class="n mono">2026</td></tr>
       </tbody></table>
       <div class="prose"><p>Almost certainly these measure different things: a short awareness or digital-literacy
         module counted per head, against a structured policy or technical programme. All three may be accurate.</p>
        <p><b>The platform publishes all three rather than choosing between them.</b> Adopting the largest figure
         would flatter the skills dimension on an undefined basis; adopting the smallest would ignore an official
         source. Neither is measurement. What is needed is a published definition of what "trained in AI" counts, and that is a request worth making of RAIA.</p></div>
       ${srcLine("RAIA_CATALOGUE","cross-checked against the 2022 assessment and the 2026 review")}`)}
   </div>

   <div class="row" style="grid-template-columns:1fr 1.2fr">

async function exRows(){
  let rows=await api.indicators({q:EX.q,dim:EX.dim,source:EX.source,org:EX.org,evidence:EX.evidence,status:EX.status});
  if(EX.origin){
    const yr=EX.year;
    rows=rows.filter(i=>{const o=i.obs.find(x=>x.year===yr);return o&&(o.origin||"demo")===EX.origin});
  }
  const k=EX.sort;
  rows=rows.slice().sort((a,b)=>{
    const g=x=>k==="score"?(RUNS[EX.year].iS[x.code].score===null?-1:RUNS[EX.year].iS[x.code].score)
      :k==="conf"?RUNS[EX.year].iS[x.code].confidence:k==="updated"?x.lastUpdated:x[k];
    const va=g(a),vb=g(b);return (va>vb?1:va<vb?-1:0)*EX.dir});

}

/* ========================== ABOUT / METHODOLOGY ========================== */
VIEWS.about=async function(){
  const g=await api.glossary();
  return vh("Understand","About and methodology",
    "What this platform is, what each measurement means, how it is calculated, and where it is weak. If you only read one page before citing a number, read this one.")
  +`<div class="row" style="grid-template-columns:1fr">
     ${card("What the Rwanda AI Tracker is","",
      `<div class="prose">
        <p>An <b>independent, multi-source intelligence platform</b> on Rwanda's AI ecosystem. It aggregates evidence from government, academia, industry, investors, international organisations and verified community contributors, and presents it with the provenance attached.</p>
        <p>It is <b>not a government publication</b>, and it does not speak for any institution. Where it computes a score, that score is the platform's own calculation under a declared methodology, not an official national figure.</p>
        <p>It exists because two substantial pieces of work were done in 2022, a national AI readiness and maturity framework, and a full economic sizing of AI's potential, and both were static documents. This turns them into something that can be kept current, argued with and built on.</p>
       </div>`)}
   </div>
   <div class="row" style="grid-template-columns:1fr 1fr">
     ${card("The measurement framework","six dimensions, 14 policy outputs, "+IND.length+" tracked indicators",
      `<div class="prose"><p>The structure comes directly from Rwanda's national AI policy as operationalised in the 2022 readiness framework: three enablers, two accelerators and one safeguard.</p></div>
       ${DIMS.map(D=>`<div class="kv" style="cursor:pointer" data-act="dimension" data-args="${D.id}">
         <span class="k"><b style="color:${D.color}">${D.id}</b> ${esc(D.short)}<div class="small muted">${esc(D.cls)} · ${IND.filter(i=>i.dim===D.id).length} indicators</div></span>
         <span class="v mono">${fmt(RUN.dS[D.id].score)}</span></div>`).join("")}
       ${srcLine("AIRM22")}`)}
     ${card("An honest statement about scoring","the most important caveat on this platform",
      `<div class="prose">
        <p>The 2022 national framework defines the indicators <b>but does not define a scoring system</b>. There is no published normalisation rule, no indicator weighting, no aggregation formula, no composite score and no maturity thresholds in the source document.</p>
        <p>So the readiness score, maturity score and maturity level shown here are <b>this platform's computation</b>, under methodology ${META.methodology}, using equal weights within each level of the framework's own hierarchy. They are reproducible and fully documented below, and they are not official.</p>
        <p>The alternative would have been to show 73 disconnected indicators and leave every reader to aggregate them privately. This is the more useful choice, but only if the caveat travels with the number. It does: every score on the platform carries its methodology version, coverage and confidence.</p>
       </div>`)}
   </div>
   <div class="row" style="grid-template-columns:1fr">
     ${card("How a score is calculated","step by step",
      `<div class="prose"><p><b>1. Normalise.</b> Each indicator is converted to 0–100 by a method declared in its record:</p></div>
       <table class="dt" style="margin:8px 0"><thead><tr><th>Method</th><th>Used for</th><th>Formula</th><th class="n">Indicators</th></tr></thead><tbody>
        ${[["Goalpost","continuous measures with a target","100 × (clip(x, L, U) − L) / (U − L)","goalpost"],
           ["Log goalpost","skewed counts, commits, citations, trainees, firms","100 × [ln(1+x) − ln(1+L)] / [ln(1+U) − ln(1+L)]","log"],
           ["Binary","yes/no instruments","100 if true, else 0","binary"],
           ["Ordinal","institutional instruments with partial credit","0 not in place · 50 drafted · 100 in force","ordinal"],
           ["Pass-through","external composite indices","rescaled by the index's own published bounds","passthrough"],
           ["Rank inversion","position in a global index","100 × (N − rank + 1) / N, N = 172","rank"]]
          .map(r=>`<tr><td><b>${r[0]}</b></td><td class="small muted">${r[1]}</td><td class="mono small">${r[2]}</td>
            <td class="n mono">${IND.filter(i=>i.method===r[3]).length}</td></tr>`).join("")}
       </tbody></table>
       <div class="prose">
        <p><b>2. Aggregate.</b> Indicator → policy output → dimension → index, as a weighted mean with weights renormalised over the indicators that actually reported. Coverage propagates up the tree, so a dimension that lost an indicator shows it.</p>
        <p><b>3. Handle what is missing.</b> Nothing is imputed into a published figure. An indicator with no observation is excluded and lowers coverage. Below 75% coverage a figure is marked provisional; below 50% it is not published at all.</p>
        <p><b>4. Score confidence separately.</b> Confidence is 0.30 × source reliability + 0.20 × accessibility + 0.25 × recency + 0.25 × verification level. It is published <i>beside</i> the score and never used to adjust it, those are two different claims.</p>
        <p><b>5. Assign a maturity level.</b> The level is the lower of the score band and the capability gates. A country should not reach a higher level by accumulating easy indicators while lacking foundational institutions.</p>

function signIn(){
  const r=document.getElementById("roleSel").value;
  SESSION.role=r;SESSION.user=r==="Public Viewer"?"Public visitor":"Demo "+r.toLowerCase();
  logAudit("SIGN_IN","session",null,r);toast("Signed in as "+r);go("admin");
}
function signOut(){logAudit("SIGN_OUT","session",SESSION.role,null);SESSION.role="Public Viewer";SESSION.user="Public visitor";toast("Signed out");go("admin")}
async function doEdit(){
  const code=document.getElementById("edCode").value,year=+document.getElementById("edYear").value;
  const v=parseFloat(document.getElementById("edVal").value),why=document.getElementById("edWhy").value;
  if(isNaN(v))return toast("Enter a numeric value");
  try{await api.updateObservation(code,year,v,why);toast(code+" updated, all scores recomputed");go("admin")}
  catch(e){toast(e.message)}
}
async function doVerify(code,state){
  try{await api.setVerification(code,state);toast(code+" marked "+VSTATE[state][1].toLowerCase());go("admin")}
  catch(e){toast(e.message)}
}
function doLoad(){
  const f=document.getElementById("dsFile").files[0];
  if(!f)return toast("Choose a JSON file first");
  const rd=new FileReader();
  rd.onload=async()=>{try{const j=JSON.parse(rd.result);const r=await api.loadDataset(j);
    toast("Applied "+r.applied+" observations, platform recomputed");go("admin")}
    catch(e){toast("Could not load: "+e.message)}};
  rd.readAsText(f);
}

      <div class="bd">

          <div class="cs-form" aria-hidden="true">

            <div style="margin-top:10px">${field("Method and source, how do you know this?",

          </div>
          <div class="cs-veil">
            <span class="cs-badge">Coming soon</span>

async function submitContribution(){
  const g=id=>(document.getElementById(id)||{value:""}).value.trim();
  if(!g("cbWho")||!g("cbVal"))return toast("Organisation and value are both required");
  await api.addContribution({who:g("cbWho"),kind:g("cbKind"),target:g("cbTarget")||", ",value:g("cbVal"),note:g("cbNote")||"No method supplied, reviewer will request one."});
  closeDrawer();toast("Submitted to the review queue");
  if(["overview","sources"].includes(VIEW))go(VIEW);
}

  const inds=IND.filter(i=>i.dim===id);
  const outs=D.outputs.map(o=>({O:OUTPUTS.find(x=>x.id===o),s:RUN.oS[o]})).sort((a,b)=>a.s.score-b.s.score);
  openDrawer(D.n,`DIMENSION ${D.id} · ${D.cls}`,
    `<div class="row" style="grid-template-columns:1fr 1fr 1fr;gap:10px">
      ${kpi("Score",fmt(d.score),deltaHtml(d.score,p.score," pts"),scColor(d.score))}
      ${kpi("Coverage",pct(d.coverage),`${inds.filter(i=>i.notReported).length} indicators not reported`)}
      ${kpi("Confidence",confLabel(d.confidence),pct(d.confidence))}
     </div>
     ${card("Why this dimension matters","",`<div class="prose"><p>${esc(D.why)}</p><p class="muted"><b>Policy objective:</b> ${esc(D.obj)}</p></div>`)}
     <div style="height:12px"></div>
     ${cardF("Trajectory","",`<div data-chart="dimTrend" data-dim="${id}" style="height:220px"></div>`)}
     <div style="height:12px"></div>
     ${card("Policy outputs","weakest first",outs.map(o=>`
       <div style="margin-bottom:10px">
         <div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px">
           <span><b class="mono">${o.O.id}</b> ${esc(o.O.n)}</span><b style="color:${scColor(o.s.score)}">${fmt(o.s.score)}</b></div>
         <div class="bar" style="margin-top:5px"><i style="width:${o.s.score||0}%;background:${scColor(o.s.score)}"></i></div>
         <div class="small muted" style="margin-top:3px">${o.s.children?"":""}${IND.filter(i=>i.output===o.O.id).length} indicators · coverage ${pct(o.s.coverage)}</div>

function indDrawer(code){
  const I=BYCODE[code];if(!I)return;
  const s=RUN.iS[code],p=PREV.iS[code],O=OUTPUTS.find(o=>o.id===I.output),D=DIMS.find(d=>d.id===I.dim);
  const src=SRC(I.sourceId);
  const formula={log:"score = 100 × [ ln(1+x) − ln(1+L) ] ÷ [ ln(1+U) − ln(1+L) ]",
    goalpost:"score = 100 × ( clip(x, L, U) − L ) ÷ ( U − L )",
    binary:"score = 100 if true, else 0",
    ordinal:"score = ordinal state ∈ { 0 not in place, 50 drafted, 100 in force }",
    passthrough:"score = 100 × ( x − min ) ÷ ( max − min ), external composite, never recomputed",
    rank:"score = 100 × ( N − rank + 1 ) ÷ N, with N = 172"}[I.method];
  openDrawer(I.name,`INDICATOR · ${code} · ${D.short}`,
    `<div class="row" style="grid-template-columns:1fr 1fr 1fr;gap:10px">
      ${kpi("Reported value",s.raw===null?unavailable("not reported"):rawFmt(I,s.raw),esc(I.unit))}
      ${kpi("Normalised score",s.assessed?fmt(s.score):", ",deltaHtml(s.score,p.score," pts"),scColor(s.score))}
      ${kpi("Confidence",pct(s.confidence),confLabel(s.confidence))}
     </div>
     ${card("What it means and why it matters","",
       `${I.definition?`<div class="prose"><p><b>Definition.</b> ${esc(I.definition)}</p></div>`:""}
        ${I.methodology?`<div class="prose"><p><b>How it is measured.</b> ${esc(I.methodology)}</p></div>`:""}
        <div class="prose"><p>${esc(I.name)}, measured in ${esc(I.unit)}. ${I.pol==="+"?"Higher is better.":"Lower is better."}
         It contributes to <b>${esc(O.n)}</b> under <b>${esc(D.n)}</b>, and counts toward the ${I.mem==="R"?"readiness":"maturity"} index.</p>
         <p>${esc(D.why)}</p>
         ${I.gate?`<p style="color:var(--brand)"><b>This indicator is a capability gate for maturity level ${I.gate}</b>, the level cannot be reached while it is unmet, regardless of the score.</p>`:""}
         ${I.note?`<p style="color:var(--amber)"><b>Note:</b> ${esc(I.note)}</p>`:""}</div>`)}
     <div style="height:12px"></div>
     ${cardF("History","reported values and normalised score",
       `<div data-chart="indTrend" data-code="${code}" style="height:240px"></div>
        ${I.obs.filter(o=>o.note).length?`<div style="padding:0 15px 13px">${I.obs.filter(o=>o.note).map(o=>
          `<div class="small muted">· <b>${o.year}</b> ${esc(o.note)}</div>`).join("")}</div>`:""}`)}
     <div style="height:12px"></div>
     ${card("How it is measured","",
       `<div class="kv"><span class="k">Measurement type</span><span class="v">${EVIDENCE_LABEL[I.evidenceType]}</span></div>
        <div class="kv"><span class="k">Normalisation method</span><span class="v">${I.method}</span></div>
        <div class="mono" style="background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:11px;font-size:11.5px;margin:9px 0;line-height:1.9">
          ${formula}<br><span class="muted">L = ${rawFmt(I,I.baseline)} (baseline ${META.firstYear}) · U = ${rawFmt(I,I.target)} (reference target 2030)</span>
          ${s.assessed?`<br><span style="color:var(--brand)">with x = ${rawFmt(I,s.raw)} → score ${fmt(s.score)}</span>`:""}</div>
        <div class="kv"><span class="k">Weight within ${O.id}</span><span class="v mono">${(100/IND.filter(x=>x.output===I.output).length).toFixed(1)}%</span></div>
        <div class="kv"><span class="k">Share of the national index</span><span class="v mono">${(100/IND.filter(x=>x.output===I.output).length/D.outputs.length/6).toFixed(2)}%</span></div>
        <div class="kv"><span class="k">Methodology version</span><span class="v mono">${META.methodology}</span></div>`)}
     <div style="height:12px"></div>
     ${card("Provenance","",
       `<div class="kv"><span class="k">Source</span><span class="v"><span class="src" data-act="source" data-args="${I.sourceId}">${esc(src.name)}</span></span></div>
        <div class="kv"><span class="k">Publishing organisation</span><span class="v">${esc(src.org)}</span></div>
        <div class="kv"><span class="k">Reporting organisation</span><span class="v">${esc((ORG[I.owner]||{name:I.owner}).name)}</span></div>
        <div class="kv"><span class="k">Contributor</span><span class="v">${esc(I.contributor)}</span></div>
        <div class="kv"><span class="k">Reporting period</span><span class="v mono">${META.cycle-(I.stale||0)}</span></div>
        <div class="kv"><span class="k">Collection date</span><span class="v mono">${(I.obs.find(o=>o.year===META.cycle-(I.stale||0))||{}).collected||", "}</span></div>

        <div class="kv"><span class="k">Update frequency</span><span class="v">${esc(I.updateFrequency)}</span></div>
        <div class="kv"><span class="k">Observations on record</span><span class="v mono">${I.obs.length} (${I.obs.length?I.obs[0].year+"–"+I.obs[I.obs.length-1].year:"none"})</span></div>
        <div class="kv"><span class="k">Verification status</span><span class="v">${qbadge(I.verification)}</span></div>
        <div class="kv"><span class="k">Last updated</span><span class="v mono">${I.lastUpdated}</span></div>
        ${src.url?`<div style="margin-top:10px"><a class="btn sm" href="${src.url}" target="_blank" rel="noopener">Open the source ↗</a></div>`:""}
        ${I.stale?`<div class="small" style="margin-top:9px;color:var(--amber)">This indicator is ${I.stale} reporting cycle${I.stale>1?"s":""} behind its expected refresh. Its confidence has been reduced accordingly.</div>`:""}
        ${I.notReported?`<div class="small" style="margin-top:9px;color:var(--red)">No observation was reported for ${META.cycle}. The indicator is excluded from aggregation and counts against coverage, it is not treated as zero.</div>`:""}`)}
     <div style="height:12px"></div>
     <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn" data-act="closeAndGo" data-args="explorer">See it in the Data Explorer</button>
       <button class="btn" data-act="source" data-args="${I.sourceId}">About this source</button>
       <button class="btn pri" data-act="closeAndContribute" data-args="Correction">Contribute a correction</button></div>`,
    `<b data-act="go" data-args="readiness">Readiness</b> › <b data-act="dimension" data-args="${I.dim}">${I.dim}</b> › ${I.output} › <b>${code}</b>`);
}

  openDrawer(s.name+" "+s.edition,`COMPARATIVE INDEX · TIER ${s.tier}`,
    card("What it measures","",
      `<div class="prose"><p>${esc(s.measures)}</p><p>${esc(s.reading)}</p></div>
       <div class="kv"><span class="k">Scale</span><span class="v">${esc(s.scale)}</span></div>
       <div class="kv"><span class="k">Scope</span><span class="v">${esc(s.scope)}</span></div>
       <div class="kv"><span class="k">Comparability</span><span class="v">Tier ${s.tier}. ${esc(BENCH.tiers[s.tier].label)}</span></div>
       <div class="small muted" style="margin-top:8px">${esc(BENCH.tiers[s.tier].detail)}</div>
       ${srcLine(s.sourceId)}`)
    +`<div style="height:12px"></div>`
    +cardF("Full set","",
      `<table class="dt"><thead><tr><th>Country</th><th class="n">Value</th>${sorted[0].rank?'<th class="n">Rank</th>':""}</tr></thead><tbody>
       ${sorted.map(v=>`<tr style="${v.iso3==="RWA"?"background:var(--hover)":""}">
         <td>${v.iso3==="RWA"?"<b>"+esc(v.country)+"</b>":esc(v.country)}</td>
         <td class="n mono">${v.value}</td>${v.rank?`<td class="n mono">#${v.rank}</td>`:""}</tr>`).join("")}
      </tbody></table>`),
    `<b data-act="go" data-args="position">Global position</b> › <b>${esc(s.name)}</b>`);
}


/* ===== 99-boot.js ===== */

/* ================================= BOOT =================================
   Load the dataset (API → snapshot → embedded), assemble indicators, run the
   scoring engine, then render. The UI code below this point is untouched.
   ======================================================================*/
async function boot(){
  // Optional runtime dependencies. Both may legitimately be absent, this file
  // is designed to work when it is opened straight from disk.
  await loadDeploymentConfig();
  const charts = await ensureCharts();

  try{
    const ds=await loadDataset();
    applyDataset(ds);
    runEngine();
    bindDB();
  }catch(e){
    document.getElementById("main").innerHTML=
      `<div class="card"><div class="bd"><b>The data layer could not be loaded.</b>
        <div class="prose" style="margin-top:8px">${e.message}</div>
        <div class="small muted" style="margin-top:8px">Tried, in order: ${META.apiBase?"the API at "+META.apiBase+", ":""}the snapshot at ${META.snapshotUrl}, then the embedded dataset.</div>
      </div></div>`;
    throw e;
  }
  renderNav();renderFresh();renderFooter();
  await applyRoute();       // deep link, bookmark or back button decides the first view
  console.log("%cRwanda AI Tracker","font-weight:700",
    "| data origin",META.dataOrigin,"| readiness",RUN.readiness.score.toFixed(2),
    "| maturity",RUN.maturity.score.toFixed(2),"| level L"+ML.assigned,
    "| indicators",IND.length,"| observations",OBSERVATIONS.length,"| sources",Object.keys(SOURCES).length,
    "| charts",charts);
}
boot();

</script>
