:"UC-R29","name":"Drone-based land mapping and monitoring","org":"CHARIS","sector":"AGR","stage":"Scaled","since":2026,"district":"RW-KG-NYA","publicSector":true,"risk":"Medium","src":"RAIA_CATALOGUE","status":"verified","origin":"source-reported","onNationalRecord":true,"raiaSector":"Agriculture","raiaStage":"Deployed at scale","desc":"Aerial mapping and monitoring services."},{"id":"UC-R31","name":"Citizen services AI chatbot","org":"IREMBO","sector":"PUB","stage":"Pilot","since":2026,"district":"RW-KG-NYA","publicSector":true,"risk":"Medium","src":"RAIA_CATALOGUE","status":"verified","origin":"source-reported","onNationalRecord":true,"raiaSector":"Public administration","raiaStage":"Pilot/MVP","desc":"Assisted navigation of government e-services."},{"id":"UC-R32","name":"Horizon 1000: frontline clinical decision support","org":"MINISTRYOFHE","sector":"HLT","stage":"PoC","since":2026,"district":"RW-KG-NYA","publicSector":true,"risk":"Medium","src":"RAIA_CATALOGUE","status":"verified","origin":"source-reported","onNationalRecord":true,"raiaSector":"Health","raiaStage":"Concept","desc":"Scalable decision support for frontline workers, for consistent high-quality care in the first 1,000 days of life."},{"id":"UC-R33","name":"AI-enabled digital service delivery","org":"RSSB","sector":"PUB","stage":"Production","since":2026,"district":"RW-KG-NYA","publicSector":true,"risk":"Medium","src":"RAIA_CATALOGUE","status":"verified","origin":"source-reported","onNationalRecord":true,"raiaSector":"Public administration","raiaStage":"Scaling","desc":"AI-supported delivery of social security services."},{"id":"UC-R34","name":"Auto-transcription of doctor-patient consultations","org":"SCALEHUB","sector":"HLT","stage":"Pilot","since":2026,"district":"RW-KG-NYA","publicSector":true,"risk":"Medium","src":"RAIA_CATALOGUE","status":"verified","origin":"source-reported","onNationalRecord":true,"raiaSector":"Health","raiaStage":"Pilot/MVP","desc":"Automatic consultation transcription to cut clinical administrative time."}]},"contributions":{"version":1,"items":[{"id":"C-1042","when":"2026-09-12","who":"Rwanda ICT Chamber","kind":"Indicator observation","target":"RWA1-SUB6","value":"38 firms (2026)","note":"Member survey, 214 respondents, self-reported AI or advanced-analytics use.","state":"In review","reviewer":"NISR"},{"id":"C-1041","when":"2026-09-10","who":"Carnegie Mellon University Africa","kind":"Indicator observation","target":"RWA2-SUBf","value":"128 postgraduates (2026)","note":"Combined AI and data-science cohorts across three institutions.","state":"In review","reviewer":"MINEDUC"},{"id":"C-1039","when":"2026-09-08","who":"Norrsken House Kigali","kind":"Use case","target":"UC-018","value":"AI credit scoring for informal traders","note":"Portfolio company; pilot with two microfinance institutions.","state":"Awaiting evidence","reviewer":", "},{"id":"C-1036","when":"2026-09-03","who":"Independent researcher","kind":"Correction","target":"TOR51","value":"Download speed methodology","note":"Flags that fixed and mobile medians are being conflated in the published series.","state":"Accepted, correction queued","reviewer":"RURA"},{"id":"C-1031","when":"2026-08-27","who":"Development partner","kind":"Source","target":", ","value":"Skills gap assessment 2026","note":"Offers microdata under a data-sharing agreement.","state":"In review","reviewer":"MINICT"}]},"economicSizing2022":{"version":1,"source":"ECON22","published":"September 2022","currency":"USD","headline":{"totalMn":589,"shareOfGDP":6,"definition":"Full potential of today's AI and advanced-analytics applications if adopted across the economy, not a forecast, not value captured today, and not a target.","method":"Bottom-up, use-case-driven 'micro to macro' sizing: select use cases per sector, adjust benchmark impact to the Rwandan context, size at organisation level against a baseline, scale to sector and economy."},"redistributionMn":295,"redistributionNote":"A further ~USD 295m of company-level benefit was estimated to come at the expense of other firms, it shifts market share without adding to national output, and is excluded from the 589m figure.","sectors":[{"sector":"AGR","valueMn":102,"shareSectorGDP":4,"driver":"Increasing yields by reducing crop waste"},{"sector":"PUB","valueMn":84,"shareSectorGDP":10,"driver":"Tax analytics, procurement savings, targeted social spending"},{"sector":"MAN","valueMn":77,"shareSectorGDP":8,"driver":"Procurement and network optimisation"},{"sector":"HLT","valueMn":51,"shareSectorGDP":27,"driver":"Workforce analytics and optimisation"},{"sector":"FIN","valueMn":40,"shareSectorGDP":15,"driver":"Reduction of fraud losses"},{"sector":"CON","valueMn":33,"shareSectorGDP":4,"driver":"Almost exclusively procurement analytics"},{"sector":"RET","valueMn":30,"shareSectorGDP":3,"driver":"Supplier optimisation and personalisation"},{"sector":"ICT","valueMn":25,"shareSectorGDP":6,"driver":"Customer service and network optimisation"},{"sector":"TRA","valueMn":18,"shareSectorGDP":3,"driver":"Supply-chain refinement"},{"sector":"OTH","valueMn":128,"shareSectorGDP":8,"driver":"Mining, real estate, utilities, admin and support, accommodation and food"}],"domainSplit":{"available":false,"note":"The study also splits the 589m across 15 analytics domains (procurement analytics, fraud & debt, personalisation, throughput/yield and others). The column-to-domain pairing could not be recovered reliably from the source deck, so it is not published here. Digitising it requires the original full-potential sizing tool.","domains":["Integrated supply chain optimisation","Pricing, promotions and assortment","Strategic & financial analytics","Customer service optimisation","Sales channel optimisation","R&D & innovation analytics","Network optimisation","Robotics / automation","Procurement analytics","HR & people analytics","Fraud & debt analytics","Personalisation insights","Accounting & IT analytics","Digital marketing","Throughput, yield"]},"lighthouse":[{"id":"LH1","name":"Crop-loss early warning for farmers","sector":"AGR","lowMn":20,"highMn":30,"owner":"MINAGRI / Rwanda Meteorology Agency","mechanism":"Localised weather prediction delivered to farmers by SMS/voice, built on automatic weather stations and the national farmer registry.","benchmark":"Reduce crop loss by 5–10%","context":"Agriculture provides a livelihood to over 76% of the population and accounts for about 33% of GDP. FAO estimates farmers could be losing up to 40% of current production for want of early warning, among other risks. Mobile connectivity of 73.9% makes SMS delivery viable.","social":"Improved national food security; greater income stability for farmers."},{"id":"LH2","name":"Bus routing and scheduling optimisation, Kigali","sector":"TRA","lowMn":2,"highMn":5,"owner":"City of Kigali / MININFRA","mechanism":"Optimise routes and timetables to cut fuel cost and passenger waiting time.","benchmark":"2–5% savings in operating costs (fuel and labour)","context":"Direct operator value only; commuter time savings are additional and were not monetised.","social":"Time saved for citizens, lower emissions, higher on-time reliability."},{"id":"LH3","name":"Social security claims risk profiling","sector":"PUB","lowMn":3,"highMn":7,"owner":"Rwanda Social Security Board","mechanism":"Risk-score claims to reduce incorrect payments, wrong decision, wrong amount, or inconsistent with plan.","benchmark":"Reduce improper payments by 5–10%","context":"Applied to ~USD 98m of social benefit payouts (2019 RSSB annual report), of which roughly 70% were medical, CBHI and maternity payouts excluding pensions.","social":"Reinforced integrity of the social security system; funds freed for legitimate claims."},{"id":"LH4","name":"Public spend and procurement analytics","sector":"PUB","lowMn":10,"highMn":20,"owner":"Rwanda Public Procurement Authority","mechanism":"Spend visualisation and contract-text analytics across agencies to surface savings opportunities and contractual clauses of interest.","benchmark":"10–15% procurement savings on addressable categories","context":"Government spending for FY 2021/22 was estimated at about USD 3.6bn.","social":"Better functioning agencies; less repetitive work for staff."},{"id":"LH5","name":"Tax audit targeting and compliance scoring","sector":"PUB","lowMn":8,"highMn":16,"owner":"Rwanda Revenue Authority","mechanism":"Advanced analytics over tax submissions to select audit cases and target inspections.","benchmark":"1–2% increase in tax revenue collected","context":"Higher taxable income recovered and fewer underreporting cases.","social":"Helps taxpayers comply; increases budget available for national investment."}],"socialDimensions":[{"id":"ECO","name":"Economic & education opportunity","desc":"Reduce unemployment and raise education levels through adaptive learning and targeted upskilling against future job demand."},{"id":"SOC","name":"Socio-environment","desc":"Improve citizen safety and government efficiency through preventive, targeted intervention, for example better placement of schools and social services."},{"id":"HLT","name":"Public health","desc":"Better health outcomes through higher-quality care and improved employee safety."},{"id":"WRK","name":"Work life & recreation","desc":"Automate repetitive and tedious tasks, raising job quality, satisfaction and safety."},{"id":"ENV","name":"Environment","desc":"Reduce emissions and resource use."}],"socialGrades":{"PUB":{"ECO":3,"SOC":3,"HLT":2,"WRK":3,"ENV":1},"AGR":{"ECO":3,"SOC":2,"HLT":1,"WRK":2,"ENV":3},"HLT":{"ECO":1,"SOC":2,"HLT":3,"WRK":2,"ENV":1},"MAN":{"ECO":2,"SOC":1,"HLT":1,"WRK":3,"ENV":2},"FIN":{"ECO":3,"SOC":1,"HLT":1,"WRK":2,"ENV":1},"ICT":{"ECO":2,"SOC":3,"HLT":1,"WRK":2,"ENV":1},"TRA":{"ECO":1,"SOC":2,"HLT":1,"WRK":2,"ENV":3},"RET":{"ECO":2,"SOC":1,"HLT":1,"WRK":3,"ENV":1},"CON":{"ECO":2,"SOC":1,"HLT":2,"WRK":3,"ENV":1}},"socialGradeNote":"Each sized use case was graded 1 (low) to 3 (high) on five qualitative dimensions and averaged to a sector grade. Only use cases with a sized financial value were graded, high-social-value cases without a financial estimate are absent.","enablerInitiatives":[{"id":"EI-A","name":"National AI Innovation Lab","costK":270,"owner":"C4IR","desc":"Matchmaker between innovators and problem statements, through targeted competitions on priority use cases that benefit many organisations."},{"id":"EI-B","name":"Venture builder programme","costK":260,"owner":"C4IR","desc":"Support companies to frame AI problem statements, design architecture and find AI engineers."},{"id":"EI-C","name":"AI awareness and training programmes","costK":110,"owner":"C4IR / MINICT","desc":"Broad AI literacy for communities and institutions, modelled on programmes such as Finland's Elements of AI."},{"id":"EI-D","name":"AI Summit","costK":200,"owner":"C4IR","desc":"Convene research, innovation, talent, financiers and ecosystem partners."},{"id":"EI-E","name":"Rwanda AI community","costK":153,"owner":"C4IR","desc":"Forums, working sessions and networking to connect innovators across the country."}],"enablerNote":"Indicative first-year operating costs from international benchmarks, as published in the 2022 study. Not budget allocations and not commitments.","context":[{"k":"Global AI economic impact","v":"~USD 13 trillion by 2030","note":"Global estimate cited as the motivating context for the study."},{"k":"Rwanda R&D intensity","v":"~0.7% of GDP","note":"Indicative, where data is available; the share attributable to AI is unknown."},{"k":"4G LTE coverage","v":"95%","note":"Cited in the 2022 enabler snapshot."},{"k":"National Data Centre","v":"Tier 3, 99.98% reliability","note":"Launching point for many government services."},{"k":"Mobile connectivity","v":"73.9%","note":"Basis for SMS-delivered advisory services."},{"k":"Agriculture share of GDP","v":"~33%, ~70% of population engaged","note":"Context for the agriculture use case."},{"k":"Government spending FY2021/22","v":"~USD 3.6bn","note":"Base for procurement and tax use cases."}],"caveats":["A full-potential exercise, not a view of what can be captured in any given period.","An order-of-magnitude sizing to support directional prioritisation, not a business case for any specific investment.","Measures the potential of the technology available in 2022; it makes no assumption about later technologies, including generative AI.","Excludes the cost of capture and the investment required to realise the value.","Redeployment of freed resources is assumed but does not happen automatically; it requires reskilling and may lag."]},"landscape2026":{"version":1,"id":"LANDSCAPE26","title":"Rwanda Artificial Intelligence Landscape Review 2026. From Policy to Impact","subtitle":"The rules are built. The use cases are proving. The substrate is missing.","author":"Aurasoft Ltd","authorRole":"Independent AI policy and regulatory analysis, Kigali, Rwanda","published":"2026-09","type":"Independent analysis","independence":"Independent analysis. Not affiliated with any consulting firm.","thesis":"Between 2021 and 2026 Rwanda constructed the most institutionally complete AI governance architecture on the African continent, ahead of states with far greater fiscal capacity, research depth and installed computing infrastructure. The open question is no longer whether Rwanda can govern AI, but whether it can build the physical and human substrate to run it on.","headline":[{"value":"3.25 / 4","label":"First in Africa on AI governance","metric":"africa_governance_index"},{"value":"111 / 121","label":"Global rank on measured AI usage","metric":"ai_usage_rank"},{"value":"$67.5M","label":"AI commitments since 2025","metric":"ai_commitments_usd"},{"value":"2.4 / 5","label":"National AI maturity score","metric":"landscape_maturity_avg"}],"findings":[{"n":1,"title":"Governance is settled","tone":"positive","text":"First national AI policy in Africa (2023) and first dedicated AI agency (2026). Ranked first on the Africa AI Governance Index at 3.25 of 4, the only state scoring strongly on both strategy and implementation."},{"n":2,"title":"Deployment is real but narrow","tone":"positive","text":"Operational systems in health intelligence, agricultural voice advisory, social protection analytics, education and statistics. Two government AI systems recognised internationally in 2026."},{"n":3,"title":"Adoption is the weak link","tone":"risk","text":"Measured usage ranks 111 of 121 globally at 0.20x the expected index. Usage skews to learning and drafting, though its composition is unusually technical."},{"n":4,"title":"The constraints are physical and human","tone":"risk","text":"Human Capital Index 0.38. Roughly 300 MW of national generation against AI campuses drawing 100 MW each. Smartphone ownership near 34 percent."},{"n":5,"title":"The gaps are cheap to close","tone":"opportunity","text":"No AI law, no public AI register, no evaluation capability and no model ownership term. Each is low cost relative to infrastructure and each raises Rwanda's position in the value chain."}],"maturityTrajectory":{"note":"Maturity stages: 1 exploring, 2 experimenting, 3 implementing, 4 scaling, 5 AI-enabled economy. Assessment of this review, not a measured index.","series":{"Governance and policy":{"2021":1,"2022":1.3,"2023":2.6,"2024":3,"2025":3.5,"2026":4},"Public sector adoption":{"2021":1,"2022":1.2,"2023":1.6,"2024":2.2,"2025":2.7,"2026":3},"Compute capability":{"2021":1,"2022":1.1,"2023":1.2,"2024":1.3,"2025":1.4,"2026":1.5}},"reading":"Governance moved from exploring to the threshold of scaling in five years. Public sector adoption reached implementation, with two systems recognised internationally. Compute barely moved: Rwanda has no domestic frontier capacity and is absent from announced regional GPU deployments. The state has internalised the diagnosis, compute and investment are named in the new agency's mandate."},"maturityAssessment2026":{"scale":"1 to 5","nationalAverage":2.4,"note":"Qualitative expert assessment across fourteen dimensions, published as analyst judgement. It is deliberately kept separate from the platform's computed readiness and maturity indices and is never merged into them.","reading":"Scores cluster at two poles: institutions above 3.0, capability and capital at or below 2.2. There is very little in the middle. Bimodality is the signature of a state that has built institutions faster than it has built industry. The failure mode to guard against is a widening gap between what the architecture can govern and what the economy can produce.","dimensions":[{"name":"Policy and governance","score":4,"pole":"institutional"},{"name":"Digital infrastructure","score":3.5,"pole":"institutional"},{"name":"Local language AI","score":3.5,"pole":"institutional"},{"name":"Data ecosystem","score":3,"pole":"institutional"},{"name":"Public sector adoption","score":3,"pole":"institutional"},{"name":"Talent","score":2.5,"pole":"capability"},{"name":"Data readiness","score":2.2,"pole":"capability"},{"name":"Responsible AI controls","score":2,"pole":"capability"},{"name":"Research","score":2,"pole":"capability"},{"name":"Private sector","score":2,"pole":"capability"},{"name":"Investment","score":2,"pole":"capital"},{"name":"Sovereignty","score":2,"pole":"capital"},{"name":"Compute","score":1.5,"pole":"capital"},{"name":"Measured impact","score":1,"pole":"capital"}]},"policySequencing":{"argument":"A state that legislated on data before it strategised on AI, strategised before it institutionalised, and institutionalised before it attempted scale. That ordering is unusual among comparator states and is why declared policy and observed implementation are scored as mutually consistent.","timeline":[{"year":2021,"event":"Data Protection and Privacy Law enacted"},{"year":2023,"event":"National AI Policy adopted, first in Africa"},{"year":2023,"event":"Data protection law becomes enforceable"},{"year":2024,"event":"NST2 approved; AI Playbook for Small States"},{"year":2025,"event":"Global AI Summit hosted; Health Intelligence Centre; Scaling Hub; Data Sharing Policy"},{"year":2026,"event":"Horizon 1000; DPI Strategy; National AI Agency; Institute of Computing"}]},"nationalAiAgency":{"approved":"2026-06-08","approvedBy":"Cabinet","claim":"Africa's first standalone national AI institution, succeeding the AI Office in the ICT ministry.","mandate":"Government transformation, research, skilling, ethics and safety, industry growth, commercialisation, investment and international engagement. RAIA's own catalogue states the mandate as AI deployment, research and talent, governance, industry development, international engagement and AI sovereignty.","instruments":"The national data centre, and a governed data sandbox giving researchers, startups and firms secure access to domestic datasets.","design":"Expressly designed to build on existing institutions, not replace them.","constraintsItResolves":[{"n":1,"constraint":"Accelerating implementation","status":"Confirmed. Pilot survival unmeasured"},{"n":2,"constraint":"Access to AI-ready data","status":"Partly addressed by the data sharing policy"},{"n":3,"constraint":"Computing infrastructure","status":"Confirmed, and constrained by energy"},{"n":4,"constraint":"Attracting talent","status":"Improving at literacy, not at engineering"},{"n":5,"constraint":"Catalysing investment","status":"A quarter of the costed policy financed"}]},"comparativePosition":{"governanceIndex":{"name":"Africa AI Governance Index 2026","scale":"score of 4, higher is better","values":[{"country":"Rwanda","value":3.25},{"country":"Nigeria","value":2.81},{"country":"Benin","value":2.58},{"country":"Kenya","value":2.47},{"country":"Egypt","value":2.25},{"country":"Ghana","value":2.21},{"country":"Mauritius","value":2.2}]},"readinessIndex":{"name":"Global AI Readiness Index 2025","scale":"rank of 195, lower is better","values":[{"country":"Egypt","value":51},{"country":"Kenya","value":65},{"country":"South Africa","value":67},{"country":"Mauritius","value":71},{"country":"Rwanda","value":75}]},"reading":"Both indices are correct. One measures capacity to govern, the other readiness to build. Rwanda's distinction is that it is the state where the gap between declared strategy and observed implementation is narrowest, not where absolute capability is highest."},"measuredAdoption":{"source":"Anthropic Economic Index, Rwanda country view, last updated 26 June 2026","caveat":"Measures Claude.ai usage only and is a proxy for frontier AI adoption, not a total measure. Percentages do not sum to 100 because privacy filters are applied.","usageRank":111,"usageUniverse":121,"usageIndex":0.2,"expectedIndex":1,"whyItMatters":"A testbed proposition requires users to test on. Governance leadership without usage is a rule set with no economy attached to it.","whatDrivesIt":"Smartphone ownership near 34 percent, mobile internet use near 20 percent, average handset prices around USD 160, and a Human Capital Index of 0.38.","opportunity":"Rwanda's constraint is demand-side and addressable through devices, connectivity cost and literacy, not through further strategy.","byCategory":[{"name":"Content creation and copywriting","share":26.1},{"name":"Education and learning","share":25.7},{"name":"Software development","share":13.7},{"name":"Document processing and research","share":12.9},{"name":"All other categories","share":21.6}],"byOccupation":[{"name":"Computer and mathematical","share":26.2},{"name":"Educational instruction","share":15.9},{"name":"Arts, design and media","share":14.2},{"name":"Office and admin support","share":9.5},{"name":"Sales and related","share":6.4},{"name":"Management","share":6.1},{"name":"Architecture and engineering","share":4.2},{"name":"Life and social science","share":4.1}],"composition":"Half of all Rwandan AI use is content creation and learning. Homework alone is the single most frequent topic at 13.2 percent. This is an early-curve profile: capability is being acquired, not yet applied to output.","distinctiveTopics":[{"name":"Math and CS theory","multiple":3},{"name":"AI app building","multiple":2.5},{"name":"Document transformation","multiple":2.5},{"name":"Homework","multiple":2.1},{"name":"Slide decks","multiple":1.7},{"name":"Instructional design","multiple":1.6},{"name":"Formatted writing","multiple":1.5},{"name":"Self-presentation writing","multiple":1.4},{"name":"Workplace writing","multiple":1.4}],"launchpadSignal":"Math and computer science theory runs at three times the global average, and AI app building at two and a half times. These are construction categories, not consumption categories. Rwandans who do use frontier AI are disproportionately building with it. Raise volume and Rwanda gets builders, not just users."},"nationalPortfolio":{"caveat":"Superseded on 17 September 2026. When this review was written Rwanda published no consolidated AI project inventory. RAIA's national record at ai.gov.rw/record now lists 34 verified use cases across 43 institutions. The two registries use different inclusion criteria, this portfolio lists flagship national initiatives, the record lists verified entries at any stage, so the counts are not directly comparable.","items":[{"name":"National AI Agency","domain":"Governance","status":"Approved June 2026","marker":"First in Africa"},{"name":"AI Scaling Hub","domain":"Cross-sector","status":"Operational","marker":"USD 17.5 million"},{"name":"Horizon 1000","domain":"Health","status":"Launched 2026","marker":"1,000 clinics by 2028"},{"name":"Health Intelligence Centre","domain":"Health","status":"Operational","marker":"Real-time national data"},{"name":"RSSB capitation analytics","domain":"Social protection","status":"Operational","marker":"1,000+ facilities"},{"name":"Tunga voice assistant","domain":"Agriculture","status":"Operational","marker":"2.5M farmer target"},{"name":"Chidi learning companion","domain":"Education","status":"Deploying","marker":"8 African countries"},{"name":"Institute of Computing","domain":"Education","status":"Opened Sept 2026","marker":"AI and cyber degrees"},{"name":"Kinyarwanda model suite","domain":"Language","status":"Open source","marker":"KinyaBERT, ColBERT, TTS"}]},"sectorDeepDives":{"health":{"headline":"Health is the most mature AI sector and the largest recipient of external capital, which is also a concentration risk.","healthIntelligenceCentre":"Operational since April 2025; integrates data from community health workers to referral hospitals. Predicts disease trends up to three months ahead, enabling targeted rather than regional intervention. Four pillars including validation and evaluation, the only formally resourced model evaluation in Rwanda.","horizon1000":"USD 50 million from the Gates Foundation and OpenAI; 1,000 clinics by 2028, Rwanda first. A three-year government MOU with Anthropic covers malaria, maternal mortality and cervical cancer elimination. Both target frontline capability: triage, documentation, referral and follow-up under human oversight.","stats":[{"value":"USD 67.5M","label":"Committed to Rwandan AI by a single foundation"},{"value":"5.6M","label":"Health worker shortfall across sub-Saharan Africa"},{"value":"450 of 510","label":"Facilities reached by the platform that closed in 2023"}],"precedent":"Rwanda's largest digital health deployment reached close to a fifth of the population and collapsed in September 2023 when its foreign parent entered bankruptcy. Continuity, data portability and model portability should be mandatory clauses in every public AI contract."},"agriculture":{"headline":"Tunga answers farmer questions by voice in Kinyarwanda, because most users have neither a smartphone nor broadband.","problem":"The national agricultural call centre was reported at one point as staffed by two agents serving more than two million farmers. Extension coverage stood at 35 percent in 2023.","architecture":[{"component":"KinyaBERT","detail":"Morphology-aware model, 107M and 365M parameters"},{"component":"KinyaColBERT","detail":"Dense retrieval across the validated knowledge base"},{"component":"Flex-TTS","detail":"Multi-speaker Kinyarwanda speech synthesis"},{"component":"IVR layer","detail":"Delivery over basic phones, 24 hours a day"}],"performance":[{"value":"60%+","label":"Of technical farmer queries handled, with escalation to human experts"},{"value":"2.5M","label":"Farmers targeted within three years"},{"value":"35% to 69%","label":"Extension coverage, 2023 to 2029"},{"value":"1.5M","label":"Farmers already registered on the input subsidy platform"}],"sovereignty":"Models released open source in March 2026, giving Rwanda the only genuinely sovereign layer of its AI stack."},"socialProtection":{"headline":"RSSB is closing the last mile of digitisation and has already built the data engine an AI-enabled institution runs on.","pipeline":{"name":"Medallion data pipeline","sources":"Ishema, CBHI, RAMA, EjoHeza, Pension, Oracle ERP","stages":["Landing, raw ingest","Bronze, cleaned","Silver, anonymised","Gold, business ready","Platinum. ML and AI features"],"outputs":"Executive dashboards, self-service analytics, real-time tracking, and a layer built for ML models and agents","note":"Manual spreadsheets and ad-hoc data requests have been replaced by an automated pipeline consolidating every scheme into one governed store, with anonymisation applied before analytical use."},"achievements":{"Last mile digitisation":["Pension approval now 7 days; 3,333 pensioners onboarded with zero paper and zero trips","Medical pre-approval cut from days to under 15 minutes, over 76,000 requests","100 percent paperless prescriptions across 250 or more private facilities"],"Operational excellence":["Data sync at 96 percent to Oracle ERP and 98 percent to the revenue authority","93 percent first-contact resolution, averaging about four hours","Rwf 270 million in unallocated pension funds cleared through payroll integration"],"Resilience and AI readiness":["Recovery point near zero and recovery time under five minutes across six databases","98 percent of penetration-test vulnerabilities remediated","Policy knowledge base with AI-assisted navigation already in use internally"]},"whyItMatters":"RSSB already runs capitation analytics across more than 1,000 health facilities on 20 million annual visits. Financing and eligibility data is more complete and more structured than clinical records, so this is the domain where AI effects are measurable in fiscal terms, which is what the national programme lacks."}},"partnerships":{"headline":"Rwanda has converted institutional credibility into partnerships larger than its economy would normally command.","exposure":"Two of the largest commitments come from one foundation and concentrate in health, and Rwanda's two largest human-services deployments run on two different foreign models it does not own.","items":[{"partner":"Anthropic","vehicle":"Three-year government MOU","amountUsd":null,"detail":"Claude in public-sector developer workflows, 2,000 educator licences, and health goals including malaria, maternal mortality and cervical cancer elimination.","marker":"First multi-sector MOU the company has signed on the continent"},{"partner":"Gates Foundation and OpenAI","vehicle":"Horizon 1000","amountUsd":50000000,"detail":"AI for triage, documentation, referral and follow-up in 1,000 primary care clinics by 2028.","marker":"Rwanda selected as first launch country, ahead of Kenya, South Africa and Nigeria"},{"partner":"Gates Foundation and C4IR","vehicle":"AI Scaling Hub","amountUsd":17500000,"detail":"Scaling proven solutions in health, agriculture and education, then across the continent.","marker":"First of four planned continental scaling hubs"},{"partner":"GIZ and BMZ","vehicle":"Tunga and FAIR Forward","amountUsd":null,"detail":"Kinyarwanda voice advisory and the open-source model suite; earlier support to the National AI Policy.","marker":"Underwrote Rwanda's only sovereign AI layer"},{"partner":"IDRC and FCDO","vehicle":"TAIRI Lab","amountUsd":540000,"detail":"Applied AI research in health, agriculture and environment with ten postgraduate researchers.","marker":"Part of a continental AI4D lab network"}]},"deploymentBase":{"headline":"Rwandan firms cluster where domain data is jurisdiction-specific and unavailable to frontier providers.","reading":"The base clusters where Rwanda holds an asset frontier providers cannot acquire: Kinyarwanda, Rwandan law and national health logistics. That is the right competitive instinct and it emerged without industrial policy direction. But the largest disclosed domestic raise is USD 2.6 million, an order of magnitude below the level at which firms build defensible technical moats. Procurement, not grant funding, is the state's most powerful available instrument.","clusters":[{"cluster":"Language and speech","firms":[{"name":"KiNLP","detail":"KinyaBERT, KinyaColBERT, Flex-TTS"},{"name":"Digital Umuganda","detail":"Open voice datasets, speech-to-text"},{"name":"CircuitNotion","detail":"Incuti AI localised language model"},{"name":"Yali Labs","detail":"Enterprise Kinyarwanda NLP tooling"}]},{"cluster":"Health and logistics","firms":[{"name":"Viebeg","detail":"AI procurement and supply chain"},{"name":"DoctorAI","detail":"Triage and diagnostic support"},{"name":"Insightiv","detail":"Radiology image analysis"},{"name":"Zipline","detail":"Autonomous medical delivery"}]},{"cluster":"Legal, risk and enterprise","firms":[{"name":"IST Legal","detail":"Rwandan legislation and case law"},{"name":"AILEX Rwanda","detail":"Citation-grounded legal research"},{"name":"Hence","detail":"Geopolitical risk models, USD 2.6M raised"},{"name":"Soft Pi / AI7 Optivaro","detail":"Enterprise automation and agents"}]}]},"constraintStack":{"headline":"Four constraints compound rather than sit in parallel, and none is resolved by further strategy.","compounding":"Each layer compounds the next: weak human capital limits usage, and weak usage limits the private capital needed to close the other gaps.","layers":[{"layer":"Human capital","metric":"0.38","detail":"Human Capital Index 0.38. Harmonised test score 358 of a possible 625. AI literacy is being built on top of a foundational literacy problem."},{"layer":"Physical","metric":"~300 MW","detail":"Approximately 300 MW of national installed generation. A single hyperscale AI campus draws over 100 MW. Water-stressed highlands make evaporative cooling compete with agriculture."},{"layer":"Access and demand","metric":"0.20x","detail":"Smartphone ownership near 34 percent, mobile internet use near 20 percent, handsets averaging USD 160. Measured AI usage sits at 0.20x the expected index."},{"layer":"Institutional","metric":"0 of 4","detail":"No AI-specific legislation, no public register of state AI systems, no national model evaluation capability, and no standard term on ownership of models fine-tuned on Rwandan data."}]},"humanCapital":{"hci":0.38,"hciNote":"A child born in Rwanda today will be 38 percent as productive in adulthood as she could be with complete education and full health. Below the sub-Saharan African average, marginally above the low-income group average.","hciSource":"World Bank Human Capital Index, most recent value 2020","harmonisedTestScore":358,"harmonisedMin":300,"harmonisedMax":625,"gaps":[{"gap":"The workforce literacy gap","detail":"National AI literacy programmes have reached over 5,000 teachers and 50 civil servants across 24 institutions. Neither the general workforce nor the informal sector is covered by any current instrument."},{"gap":"The engineering gap","detail":"The Institute of Computing produces its first AI and cybersecurity graduates in 2029. Until then the binding constraint on delivery is engineers, not policy."},{"gap":"The retention gap","detail":"Continental assessment names brain drain as a critical risk for states that build technical talent without a domestic market able to absorb it at competitive pay. No published retention strategy exists."}]},"physicalCeiling":{"headline":"Sovereign frontier compute is not primarily a capital question for Rwanda; it is an energy and water question.","figures":[{"name":"National installed generation","mw":300},{"name":"National peak demand","mw":190},{"name":"One hyperscale AI campus","mw":100}],"note":"Installed generation and peak demand are indicative national figures from grid operator and sector reporting, 2022 to 2023, pending updated publication. Hyperscale campus load is a typical industry figure, not a Rwandan project.","reading":"A single hyperscale AI facility would draw roughly a third of Rwanda's entire installed generating capacity, and more than half its peak demand. Cooling compounds the problem: Rwanda is a water-constrained highland economy where evaporative cooling would compete directly with agriculture and household supply.","recommendations":[{"title":"Do not chase frontier training","detail":"The energy and water arithmetic does not close. Competing for hyperscale training capacity would misallocate scarce generation."},{"title":"Specialise in inference and adaptation","detail":"Fine-tuning, retrieval and small-model deployment fit the available envelope and match Rwanda's language advantage."},{"title":"Partner for the rest, on stated terms","detail":"Secure regional compute access contractually, with model ownership and continuity clauses attached."}]},"governanceGaps":{"headline":"A country that wants to be a testbed must be able to certify what was tested.","closingNote":"The cheapest of these is the most valuable. A standard national term on ownership of fine-tuned models costs nothing to draft and changes Rwanda's position in the value chain.","exists":[{"item":"Five ethical principles","detail":"Beneficence, non-maleficence, autonomy, justice, explicability"},{"item":"Enforceable data law","detail":"Registration mandatory, extraterritorial reach, 48-hour breach clock"},{"item":"Data localisation","detail":"Personal data held in Rwanda absent an authorising certificate"},{"item":"Impact assessment duty","detail":"Required for high-risk processing, which captures most AI"},{"item":"A Responsible AI Office","detail":"Cited by continental assessment as a differentiator"}],"missing":[{"item":"No AI-specific legislation","detail":"Enforcement rests on the data protection regime alone","cost":"low"},{"item":"No public register of state AI","detail":"Automated enforcement runs with no transparency duty","cost":"low"},{"item":"No model evaluation capability","detail":"Vendor accuracy claims have no domestic verifier","cost":"medium"},{"item":"No AI procurement standard","detail":"The state is anchor buyer without continuity or exit terms","cost":"low"},{"item":"No model ownership term","detail":"Ownership of models fine-tuned on Rwandan public data is undefined","cost":"lowest"}]},"proposition":{"headline":"What Rwanda offers a partner that a larger market cannot.","ask":"Co-invest in the substrate, not only in the pilots. Devices and connectivity cost, workforce literacy beyond the civil service, regional compute access on contractual terms, and a national evaluation capability that lets Rwanda certify what it has tested.","points":[{"n":1,"title":"National scale at testable size","detail":"Fourteen million people, one jurisdiction, one regulator. A deployment can reach national coverage inside a programme cycle rather than a decade."},{"n":2,"title":"Legal clarity that is actually enforced","detail":"An operative data protection regime with defined obligations, rather than a law awaiting commencement."},{"n":3,"title":"A single accountable counterparty","detail":"The National AI Agency consolidates a mandate previously spread across four institutions."},{"n":4,"title":"A technically inclined user base","detail":"Math and computer science theory at three times global average, AI app building at two and a half times."},{"n":5,"title":"Sovereign language infrastructure","detail":"An openly licensed Kinyarwanda model suite that any partner can build on without licensing friction."},{"n":6,"title":"A government willing to be first","detail":"Rwanda has been first launch country, first policy, first agency, and first summit host on the continent."}]},"agenda2026to2030":{"framing":"The decisive choices concern conversion, not ambition; none of them requires a new strategy. Converting policy into procurement standards, pilots into budget lines, literacy into engineering capability, concessional financing into commercial capital, and projected potential into measured impact.","phases":[{"period":"2026 to 2027","theme":"Institutionalise","actions":["Operationalise the AI Agency with a published statutory instrument","Launch the governed data sandbox with published access rules","Issue an AI procurement standard with continuity and exit provisions","Adopt a national term on ownership of fine-tuned models","Publish an AI project inventory and pilot survival rate","Set an energy and water envelope for AI infrastructure"]},{"period":"2027 to 2028","theme":"Scale","actions":["Move agricultural advisory to national extension coverage","Extend health intelligence into routine clinical decision support","Complete Ishema onboarding and publish measured fiscal effects","Deliver Horizon 1000 with published independent evaluation","Stand up national model evaluation with Kinyarwanda benchmarks","Attack the usage gap through device and data cost intervention"]},{"period":"2028 to 2030","theme":"Commercialise","actions":["Establish African language AI as an export capability","Sell evaluation and assurance as a tradable service line","Reposition business process services toward AI-augmented delivery","Attract private capital into inference-scale infrastructure","Graduate the first Institute of Computing cohort into domestic firms","Report measured AI contribution against the 5 to 6 percent target"]}]},"verdict":{"headline":"Rwanda's advantage is institutional; its constraint is physical and human.","paragraphs":["Institutional coherence, execution discipline and international credibility have attracted capability and capital that Rwanda's economic size would not otherwise command. It is the only African state where declared strategy and observed implementation are scored as mutually consistent.","The constraints are now measurable rather than rhetorical: a Human Capital Index of 0.38, roughly 300 MW of national generation, a third of the population holding smartphones, and measured AI usage at one fifth the expected rate. None of these is solved by strategy. All of them are solved by investment, sequencing and partnership.","Rwanda has proven it can write the rules for AI in Africa. The open question is whether it can build the substrate to run them on. On present trajectory Rwanda will remain the continent's reference case for AI governance. Whether it becomes a reference case for AI-driven economic transformation will be settled by execution rather than by further strategy."]},"publisher":"Aurasoft Ltd"},"benchmarks":{"version":1,"note":"Comparator data for the continental and global position view. Every series carries its own comparability tier, because these indices measure different things and must not be blended into a single ranking.","tiers":{"A":{"label":"Directly comparable","detail":"The same variable, published by the same body, computed identically for every country in the set."},"B":{"label":"Index-aligned estimate","detail":"Rwanda's position within a published index whose methodology and country set change between editions. Comparable within an edition, not across them."},"C":{"label":"Rwanda-specific","detail":"Indicators with no peer equivalent. Time-series and target tracking only, never a cross-country comparison."}},"series":[{"id":"africa-governance-2026","name":"Africa AI Governance Index (AAIGI)","edition":2026,"scale":"score out of 4, higher is better","tier":"B","scope":"continental","sourceId":"AFGOVIDX","measures":"Capacity to govern AI, scored across strategy and implementation.","reading":"Rwanda tops the inaugural index and is the only state scoring strongly on both Strategy & Vision and Implementation & Impact. Only Rwanda, Nigeria and Benin reach the 'Established' band; 16 states are 'Developing', 29 'Nascent' and six 'Minimal'. No African sub-region crosses the midpoint of the scale.","values":[{"country":"Rwanda","iso3":"RWA","value":3.25,"band":"Established"},{"country":"Nigeria","iso3":"NGA","value":2.81,"band":"Established"},{"country":"Benin","iso3":"BEN","value":2.58,"band":"Established"},{"country":"Kenya","iso3":"KEN","value":2.47,"band":"Developing"},{"country":"Morocco","iso3":"MAR","value":2.38,"band":"Developing"},{"country":"Egypt","iso3":"EGY","value":2.25,"band":"Developing"},{"country":"Ethiopia","iso3":"ETH","value":2.22,"band":"Developing"},{"country":"Ghana","iso3":"GHA","value":2.21,"band":"Developing"},{"country":"Mauritius","iso3":"MUS","value":2.2,"band":"Developing"},{"country":"Tunisia","iso3":"TUN","value":2.12,"band":"Developing"},{"country":"South Africa","iso3":"ZAF","value":2.1,"band":"Developing"}],"publisher":"Lawyers Hub and Africa AI Policy Lab","coverage":"All 54 African states, 80 indicators across 8 pillars"},{"id":"global-readiness-2025","name":"Government AI Readiness Index","edition":2025,"scale":"rank of 195, lower is better","tier":"B","scope":"global","sourceId":"GAIRIDX","measures":"Readiness to deploy AI, rather than capacity to govern it.","reading":"Rwanda ranks 75th globally. Oxford Insights revised the methodology for the 2025 edition, so this position cannot be compared with the 2021 score of 35.16, the platform holds the two editions as separate series.","invert":true,"values":[{"country":"Egypt","iso3":"EGY","value":51},{"country":"Kenya","iso3":"KEN","value":65},{"country":"South Africa","iso3":"ZAF","value":67},{"country":"Mauritius","iso3":"MUS","value":71},{"country":"Rwanda","iso3":"RWA","value":75}],"publisher":"Oxford Insights","coverage":"195 governments, 69 indicators across 14 dimensions and 6 pillars"},{"id":"oxford-2021","name":"Government AI Readiness Index","edition":2021,"scale":"score out of 100","tier":"B","scope":"global","sourceId":"OXFORD","measures":"Government readiness to implement AI in public service delivery.","reading":"Rwanda scored 35.16 and ranked 112 of 172, tenth in Africa. The neighbours shown are the countries immediately around it in that edition, the band is tightly packed, so small score movements produce large rank movements.","values":[{"country":"Gabon","iso3":"GAB","value":36.51,"rank":107},{"country":"Senegal","iso3":"SEN","value":36.34,"rank":108},{"country":"Botswana","iso3":"BWA","value":36.33,"rank":109},{"country":"Bangladesh","iso3":"BGD","value":36.1,"rank":110},{"country":"Cabo Verde","iso3":"CPV","value":36.07,"rank":111},{"country":"Rwanda","iso3":"RWA","value":35.16,"rank":112},{"country":"Nigeria","iso3":"NGA","value":35.15,"rank":113}]},{"id":"usage-2026","name":"Measured frontier AI usage","edition":2026,"scale":"index against an expected value of 1.00","tier":"A","scope":"global","sourceId":"ANTHROPIC_EI","measures":"Observed frontier AI usage relative to the level expected for an economy of that size and working-age population.","reading":"Rwanda ranks 111 of 121 economies at 0.20x the expected index. This is the sharpest contrast on the platform: first in Africa on the rules, near the bottom of the world on observed use.","values":[{"country":"Rwanda observed","iso3":"RWA","value":0.2},{"country":"Expected for economic size","iso3":"REF","value":1}]}],"oxfordPillars2021":{"sourceId":"OXFORD","note":"Rwanda's pillar scores in the 2021 edition, as reported in the national readiness assessment. The Data and Infrastructure pillar is the weakest and matches the constraint the 2026 review identifies five years later.","country":"Rwanda","overall":35.16,"pillars":[{"name":"Government","value":44.44},{"name":"Technology sector","value":27.03},{"name":"Data and infrastructure","value":34.01}]},"regionalAverages2021":{"sourceId":"OXFORD","note":"Regional averages in the 2021 edition, as reported in the national readiness assessment.","items":[{"name":"Sub-Saharan Africa, overall","value":31.61,"comment":"The lowest of any global region"},{"name":"Sub-Saharan Africa, data and infrastructure pillar","value":39.36,"comment":"Every other global region averages above 47.42"}]},"africaPosition":{"sourceId":"AIRM22","note":"Rwanda's standing among African states in the 2021 Oxford edition, as reported in the national readiness assessment.","rankInAfrica":10,"ahead":["South Africa","Kenya","Ghana"],"comment":"Behind more advanced digital economies. The 2026 governance index inverts this, the two indices are measuring different things."},"indexComparison":[{"index":"Africa AI Governance Index 2026","measures":"Capacity to govern AI","rwandaPosition":"1st in Africa","value":"3.25 / 4","tier":"B"},{"index":"Global AI Readiness Index 2025","measures":"Readiness to deploy AI","rwandaPosition":"5th of the African states in the set","value":"rank 75 of 195","tier":"B"},{"index":"Government AI Readiness Index 2021","measures":"Government readiness for public service AI","rwandaPosition":"10th in Africa","value":"35.16 / 100, rank 112 of 172","tier":"B"},{"index":"Measured frontier AI usage 2026","measures":"Observed usage against expected","rwandaPosition":"111th of 121 globally","value":"0.20x expected","tier":"A"}],"verifiedOn":"2026-09-15","verificationNote":"Every series on this page was checked against its publisher in September 2026. The AAIGI values are the published top ten plus South Africa; the Oxford Insights 2025 values are the African cluster reported for that edition.","verification":{"checkedOn":"2026-09-15","method":"Each index was located at its publisher, and Rwanda's value cross-checked against at least two independent reports.","findings":["Africa AI Governance Index, confirmed. Published July 2026 by the Africa AI Policy Lab and Lawyers Hub. Rwanda 3.25 of 4. The publisher was previously recorded as unattributed and has been corrected.","Government AI Readiness Index 2025, confirmed as an Oxford Insights product, 195 countries. Rwanda rank 75, Kenya 65, South Africa 67, Mauritius 71. Previously recorded as an unnamed publisher and has been corrected.","Government AI Readiness Index 2021, as cited in the 2022 national assessment. Held separately because the 2025 methodology changed.","Anthropic Economic Index, a real published country view; the Rwanda figures are as reported in the 2026 landscape review rather than re-fetched."]}},"proposedIndicators":{"version":1,"note":"The measurement roadmap: indicators this platform argues should exist but for which no observation is yet available. They are deliberately NOT part of methodology v1.3 and do not enter any score, declaring a gap is not the same as filling it. Promote one by moving its definition into indicators.json and supplying an observation.","items":[{"domain":"Compute & energy","name":"Accelerated compute available to researchers","unit":"GPU-hours/yr","rationale":"The actual currency of AI work; headline FLOPs say nothing about access.","proposedSource":"RISA, institutional returns","feasibility":"medium","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"Cost per GPU-hour, domestic versus regional","unit":"USD","rationale":"Determines whether training locally is rational at all.","proposedSource":"Vendor price survey","feasibility":"medium","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"National compute utilisation","unit":"%","rationale":"Idle capacity is a different policy problem from absent capacity.","proposedSource":"Operator telemetry","feasibility":"hard","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"Data centre power usage effectiveness","unit":"ratio","rationale":"Energy efficiency of the hosting estate.","proposedSource":"Operator reporting","feasibility":"medium","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"AI workload share of national electricity demand","unit":"%","rationale":"Directly tests the claim that one campus would draw a third of generation.","proposedSource":"REG and operators","feasibility":"medium","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"Renewable share powering data centres","unit":"%","rationale":"Rwanda's largely hydro grid is an unmeasured comparative advantage.","proposedSource":"REG","feasibility":"easy","targetDimension":"D2","status":"proposed"},{"domain":"Compute & energy","name":"Water withdrawal for data-centre cooling","unit":"m³/yr","rationale":"Cooling competes with agriculture in a water-constrained highland economy.","proposedSource":"Operators, WASAC","feasibility":"hard","targetDimension":"D2","status":"proposed"},{"domain":"Adoption depth","name":"Pilot survival rate at 24 months","unit":"%","rationale":"The 2026 review states outright that this is unmeasured; it is the single most diagnostic adoption metric.","proposedSource":"Use case registry longitudinal","feasibility":"medium","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Time from pilot to production","unit":"months","rationale":"Distinguishes an ecosystem that ships from one that pilots.","proposedSource":"Use case registry","feasibility":"easy","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Citizens served by AI-supported public services","unit":"count","rationale":"Converts deployment counts into reach.","proposedSource":"Agency reporting","feasibility":"medium","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Transactions processed with AI in the loop","unit":"count/yr","rationale":"The denominator for any productivity claim.","proposedSource":"Agency reporting","feasibility":"medium","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Public services with an AI component","unit":"% of catalogue","rationale":"Comparable across countries via e-government service catalogues.","proposedSource":"RISA","feasibility":"medium","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Agencies publishing an AI system inventory","unit":"%","rationale":"Prerequisite for the transparency register the 2026 review calls for.","proposedSource":"MINICT","feasibility":"easy","targetDimension":"D4","status":"proposed"},{"domain":"Adoption depth","name":"Decommissioned or abandoned AI systems","unit":"count","rationale":"Nobody publishes failures. A platform that did would be genuinely distinctive.","proposedSource":"Use case registry","feasibility":"medium","targetDimension":"D4","status":"proposed"},{"domain":"Sovereignty","name":"Public AI systems running on domestically-owned models","unit":"%","rationale":"Measures the layer of the stack Rwanda actually controls.","proposedSource":"Use case registry","feasibility":"easy","targetDimension":"D6","status":"proposed"},{"domain":"Sovereignty","name":"AI contracts carrying a model-ownership clause","unit":"%","rationale":"The cheapest governance gap identified in 2026, and the most valuable.","proposedSource":"RPPA","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Sovereignty","name":"Public data processed in-country","unit":"%","rationale":"Tests the data localisation regime in practice rather than in law.","proposedSource":"RURA authorisation register","feasibility":"medium","targetDimension":"D3","status":"proposed"},{"domain":"Sovereignty","name":"Kinyarwanda tokens in openly licensed corpora","unit":"count","rationale":"Free, versioned and queryable; directly measures the sovereign layer.","proposedSource":"Hugging Face Hub API","feasibility":"easy","targetDimension":"D3","status":"proposed"},{"domain":"Sovereignty","name":"Openly licensed Rwandan models published","unit":"count","rationale":"Automatable daily.","proposedSource":"Hugging Face Hub API","feasibility":"easy","targetDimension":"D3","status":"proposed"},{"domain":"Sovereignty","name":"Downloads of Rwandan open models","unit":"count/yr","rationale":"Demand signal for the sovereign language layer.","proposedSource":"Hugging Face Hub API","feasibility":"easy","targetDimension":"D5","status":"proposed"},{"domain":"Sovereignty","name":"Kinyarwanda speech recognition word error rate","unit":"%","rationale":"Quality, not just existence, of the language capability.","proposedSource":"Published benchmarks","feasibility":"medium","targetDimension":"D3","status":"proposed"},{"domain":"Sovereignty","name":"Government AI spend awarded to domestic vendors","unit":"%","rationale":"Procurement is the state's most powerful available instrument.","proposedSource":"RPPA","feasibility":"medium","targetDimension":"D5","status":"proposed"},{"domain":"Assurance & rights","name":"Algorithmic impact assessments completed","unit":"count/yr","rationale":"The data protection law already requires them for high-risk processing.","proposedSource":"NCSA","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"High-risk systems with documented human oversight","unit":"%","rationale":"Oversight claimed is not oversight evidenced.","proposedSource":"Agency returns","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"Independent model evaluations conducted","unit":"count/yr","rationale":"A testbed must be able to certify what it tested.","proposedSource":"MINICT","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"AI incidents recorded and resolved","unit":"count","rationale":"No incident register exists anywhere in the framework.","proposedSource":"NCSA","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"Redress requests concerning automated decisions","unit":"count","rationale":"Rights without a measured remedy are rights on paper.","proposedSource":"NCSA","feasibility":"hard","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"Breach notifications within the 48-hour statutory clock","unit":"%","rationale":"Tests whether the enforceable regime is actually enforced.","proposedSource":"NCSA","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"Public trust in government use of AI","unit":"% agreeing","rationale":"Adoption without consent is fragile.","proposedSource":"National survey","feasibility":"medium","targetDimension":"D6","status":"proposed"},{"domain":"Assurance & rights","name":"Data-labelling workforce covered by labour protections","unit":"%","rationale":"The continental index flags this as a blind spot no national strategy addresses.","proposedSource":"MIFOTRA","feasibility":"hard","targetDimension":"D6","status":"proposed"},{"domain":"Inclusion","name":"Gender gap in AI and digital skills participation","unit":"percentage points","rationale":"Nothing on the platform is currently disaggregated.","proposedSource":"MINEDUC, NISR","feasibility":"medium","targetDimension":"D1","status":"proposed"},{"domain":"Inclusion","name":"Gender gap in measured AI usage","unit":"percentage points","rationale":"For a country at 0.20x expected usage, distribution is the policy question.","proposedSource":"Survey or provider data","feasibility":"hard","targetDimension":"D5","status":"proposed"},{"domain":"Inclusion","name":"Rural–urban smartphone ownership gap","unit":"percentage points","rationale":"Device access is the binding demand-side constraint.","proposedSource":"RURA, NISR","feasibility":"easy","targetDimension":"D2","status":"proposed"},{"domain":"Inclusio
