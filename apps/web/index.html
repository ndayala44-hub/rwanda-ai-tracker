<!DOCTYPE html>
<!-- Dark is the default presentation. The toggle still switches to light and
     the light palette is fully maintained. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- No inline event handlers remain, so a strict policy is possible. The
     application is one inline script, that is what makes the file portable, so it is allow-listed by hash, injected at build time, rather than by
     'unsafe-inline'. Style still needs 'unsafe-inline' because the design
     system sets CSS custom properties on individual elements. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://cdnjs.cloudflare.com 'sha256-ETCIL+TMgBvgYeglWkY8LrUV0lZkCu4+yobMetrTGGk=';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self' http://localhost:4010 https:;
  font-src 'self';
  base-uri 'self';
  form-action 'none'"/>
<!-- frame-ancestors cannot be delivered via meta; it is set as an HTTP header
     in vercel.json and deploy/nginx.conf instead. -->
<title>Rwanda AI Tracker, evidence-based intelligence on Rwanda's AI ecosystem</title>
<!-- Charting library: the vendored copy is authoritative, the CDN is a fallback.
     A government analytics tool should not depend on a third party being up, and an unpinned CDN script is an unreviewed code path. Run `npm run vendor:echarts`
     to populate apps/web/vendor/ and write the integrity hash into the loader.
     No inline handler is used, because a strict CSP forbids them. -->
<!-- Nothing is loaded by a static tag. The deployment config and the charting
     library are fetched at boot, each failure tolerated, so the single file
     still works when it is opened straight from disk with no server. -->
<style>
:root[data-theme="light"]{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#FAFBFD; --raised:#FFFFFF;
  --line:#E3E8EF; --line2:#CFD8E3; --hover:#F1F5FA;
  --txt:#111B2B; --txt2:#42546B; --mut:#6B7C93; --dim:#93A1B5;
  --brand:#0A6FA8; --brand2:#0E88CC; --accent:#00A1DE;
  --green:#1B8A5A; --amber:#B8770E; --red:#C0392B; --violet:#5E4BB8; --teal:#0F8B84;
  --chip:#F0F4F9; --shadow:0 1px 2px rgba(16,30,54.06),0 4px 14px rgba(16,30,54.05);
  --ec-axis:#93A1B5; --ec-split:#EDF1F6; --ec-tip:#FFFFFF; --ec-tipline:#CFD8E3;
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#101C2E; --surface2:#0D1829; --raised:#142438;
  --line:#1D3149; --line2:#27405C; --hover:#16273C;
  --txt:#E4ECF5; --txt2:#A9BCD0; --mut:#7D93AB; --dim:#5A7089;
  --brand:#3FA9E0; --brand2:#5CBDEE; --accent:#4FC3F7;
  --green:#3ECF8E; --amber:#E8A33C; --red:#E8695C; --violet:#9B8BF0; --teal:#3FD0C9;
  --chip:#16273C; --shadow:0 1px 2px rgba(0,0,0.3),0 6px 20px rgba(0,0,0.25);
  --ec-axis:#7D93AB; --ec-split:#1A2C42; --ec-tip:#142438; --ec-tipline:#27405C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  transition:background .18s,color .18s}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg)}

#app{display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;min-height:58px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0}
.mark{width:40px;height:40px;flex:0 0 40px;position:relative;display:flex;align-items:center;justify-content:center}
.mark img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 45%,transparent))}
:root[data-theme="light"] .mark img{filter:saturate(1.05) drop-shadow(0 1px 2px rgba(10,111,168.25))}
.logo h1{font-size:15.5px;font-weight:700;letter-spacing:-.2px;line-height:1.1}
.logo p{font-size:10.5px;color:var(--mut);letter-spacing:.3px}
.topnav{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap;flex:1}
.topnav a{padding:7px 11px;border-radius:6px;font-size:13px;color:var(--txt2);text-decoration:none;cursor:pointer;white-space:nowrap}
.topnav a:hover{background:var(--hover);color:var(--txt)}
.topnav a.on{background:var(--brand);color:#fff;font-weight:500}
.topright{display:flex;align-items:center;gap:8px;margin-left:auto}
.iconbtn{background:var(--surface);border:1px solid var(--line2);color:var(--txt2);height:30px;min-width:30px;padding:0 8px;
  border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.iconbtn:hover{background:var(--hover);color:var(--txt)}
.iconbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.freshbar{background:var(--surface2);border-bottom:1px solid var(--line);padding:6px 18px;display:flex;gap:18px;
  flex-wrap:wrap;font-size:11.5px;color:var(--mut);align-items:center}
.freshbar b{color:var(--txt2);font-weight:600}
main{flex:1;padding:20px 18px 60px;max-width:1580px;width:100%;margin:0 auto}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red)} .dot.b{background:var(--brand)}
.pulse{animation:pl 2.6s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}

.vh{margin-bottom:18px}
.vh .eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand);font-weight:600}
.vh h2{font-size:25px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.vh p{font-size:14px;color:var(--mut);margin-top:6px;max-width:900px;line-height:1.6}
.vhrow{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}

.row{display:grid;gap:14px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:13.5px;font-weight:650;letter-spacing:-.1px}
.card>header .sub{font-size:11.5px;color:var(--mut)}
.card .bd{padding:15px}
.card .bd.flush{padding:0}
.kpi{padding:15px}
.kpi .lbl{font-size:11.5px;color:var(--mut);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-1.2px;margin-top:5px;line-height:1.05}
.kpi .sub{font-size:11.5px;color:var(--mut);margin-top:5px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.3px;
  padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--txt2);white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.tag.a{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.b{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.tag.v{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.tag.t{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.btn{background:var(--surface);border:1px solid var(--line2);color:var(--txt2);font-size:12.5px;padding:6px 12px;
  border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--txt)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pri:hover{background:var(--brand2)}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--chip);border-radius:7px;padding:2px}
.seg button{background:transparent;border:0;color:var(--mut);padding:5px 11px;border-radius:5px;cursor:pointer;
  font-size:12.5px;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--txt);font-weight:600;box-shadow:var(--shadow)}
input.txt,select.sel,textarea.txt{background:var(--surface);border:1px solid var(--line2);color:var(--txt);
  padding:6px 10px;border-radius:7px;font-size:13px;font-family:inherit;outline:none}
input.txt:focus,select.sel:focus{border-color:var(--brand)}
label.fl{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:16px;
  border:1px solid var(--line2);background:var(--surface);color:var(--txt2);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mut)} .kv .v{color:var(--txt);text-align:right}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--mut)}
.muted{color:var(--mut)} .small{font-size:11.5px}
.prose{font-size:13.5px;line-height:1.75;color:var(--txt2)}
.prose b.prose strong{color:var(--txt)}
.prose p{margin-bottom:10px}
.prose ul{margin:0 0 10px 18px} .prose li{margin-bottom:5px}

table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{position:sticky;top:0;background:var(--surface2);text-align:left;font-size:11px;letter-spacing:.4px;
  color:var(--mut);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap}
table.dt td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.dt tbody tr:hover td{background:var(--hover)}
table.dt td.n,table.dt th.n{text-align:right}
table.dt tr.clickable{cursor:pointer}
.scrollbox{overflow:auto}

.empty{padding:30px 20px;text-align:center;color:var(--mut);font-size:13px}
.empty .big{font-size:15px;color:var(--txt2);font-weight:600;margin-bottom:6px}
.unavail{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-style:italic}

/* provenance / quality */
.prov{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mut)}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--brand);cursor:pointer;text-decoration:none}
.src:hover{text-decoration:underline}
.qbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px}
.q-verified{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.q-review{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.q-unverified{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.q-modelled{background:color-mix(in srgb,var(--violet) 15%,transparent);color:var(--violet)}
.q-historical{background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal)}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--line2);color:var(--mut);font-size:10px;cursor:help;flex:0 0 15px}
.info:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:0 0 18px 0}
.tlitem:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;
  background:var(--surface);border:2px solid var(--brand)}
.tlitem.pending:before{border-color:var(--amber)}
.tlyear{font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.4px}
.tlt{font-size:13.5px;font-weight:600;margin-top:1px}
.tld{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.55}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,35.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,96vw);background:var(--bg);z-index:61;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.3.8.4,1);display:flex;flex-direction:column;
  border-left:1px solid var(--line)}
.drawer.on{transform:translateX(0)}
.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dbody{overflow-y:auto;padding:16px 18px 50px;flex:1}
.x{background:transparent;border:1px solid var(--line2);color:var(--mut);width:28px;height:28px;border-radius:7px;cursor:pointer}
.x:hover{color:var(--txt)}
.crumb{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut);flex-wrap:wrap;margin-bottom:10px}
.crumb b{color:var(--brand);font-weight:600;cursor:pointer}

/* matrices & misc */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.hex{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--line)}
.hexcell{background:var(--surface);padding:13px 14px;cursor:pointer}
.hexcell:hover{background:var(--hover)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--txt);color:var(--bg);
  padding:10px 18px;border-radius:9px;font-size:13px;z-index:90;transition:transform .24s;box-shadow:0 10px 30px rgba(0,0,0.25)}
.toast.on{transform:translateX(-50%) translateY(0)}
/* Modifiers are .hist.warn and .note. Do NOT use .info here, that class is
   the 15px round help badge and would collapse the banner to its width. */
.banner{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.6;margin-bottom:14px;border:1px solid}
.banner.hist{background:color-mix(in srgb,var(--teal) 8%,transparent);border-color:color-mix(in srgb,var(--teal) 30%,transparent);color:var(--txt2)}
.banner.warn{background:color-mix(in srgb,var(--amber) 9%,transparent);border-color:color-mix(in srgb,var(--amber) 32%,transparent);color:var(--txt2)}
.banner.note{background:color-mix(in srgb,var(--brand) 7%,transparent);border-color:color-mix(in srgb,var(--brand) 26%,transparent);color:var(--txt2)}
.footer{border-top:1px solid var(--line);background:var(--surface);padding:20px 18px;font-size:12px;color:var(--mut)}
.footer .fgrid{max-width:1580px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.footer b{color:var(--txt2);display:block;margin-bottom:6px;font-size:12.5px}
.footer a{color:var(--mut);text-decoration:none;display:block;padding:2px 0;cursor:pointer}
.footer a:hover{color:var(--brand)}

/* ---------------- v2: modern interaction layer ---------------- */
.card{transition:box-shadow .18s,transform .18s,border-color .18s}
.card.lift:hover{box-shadow:0 2px 4px rgba(16,30,54.07),0 12px 32px rgba(16,30,54.10);transform:translateY(-2px);border-color:var(--line2)}
:root[data-theme="dark"] .card.lift:hover{box-shadow:0 2px 6px rgba(0,0,0.4),0 14px 36px rgba(0,0,0.35)}
.kpi{position:relative;overflow:hidden}
.kpi .spark{position:absolute;right:0;bottom:0;left:0;opacity:.5;pointer-events:none}
.kpi.clickable{cursor:pointer}
.kpi .val{transition:color .2s}

/* skeletons */
@keyframes shimmer{0%{background-position:-460px 0}100%{background-position:460px 0}}
.sk{background:linear-gradient(90deg,var(--chip) 8%,var(--hover) 18%,var(--chip) 33%);
  background-size:800px 100%;animation:shimmer 1.25s linear infinite;border-radius:7px}
.skgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}

/* tooltip */
.tip{position:fixed;z-index:95;max-width:320px;background:var(--txt);color:var(--bg);padding:9px 12px;border-radius:8px;
  font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .13s,transform .13s;
  box-shadow:0 10px 30px rgba(0,0,0.28)}
.tip.on{opacity:1;transform:translateY(0)}
[data-tip]{cursor:help;border-bottom:1px dotted var(--line2)}

/* year scrubber */
.scrub{display:flex;align-items:center;gap:9px}
.scrub input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--line2);outline:none;width:150px}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--brand);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0.25);cursor:pointer}
.scrub input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--brand);border:2px solid var(--surface);cursor:pointer}
.scrub b{min-width:34px;font-variant-numeric:tabular-nums}
.histbadge{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber);font-weight:600;
  padding:2px 8px;border-radius:5px;font-size:11px}

/* filter chips bar */
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border-radius:16px;
  padding:5px 8px 5px 12px;font-size:12px;font-weight:500}
.fchip button{background:rgba(255,255,255.22);border:0;color:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;
  font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.fchip button:hover{background:rgba(255,255,255.4)}

/* command palette */
.pal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:11vh;
  background:rgba(10,20,35.42);backdrop-filter:blur(3px)}
.pal.on{display:flex}
.palbox{width:min(660px,94vw);background:var(--surface);border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0.32);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.palbox input{width:100%;border:0;outline:0;background:transparent;color:var(--txt);font-size:16px;padding:16px 18px;
  font-family:inherit;border-bottom:1px solid var(--line)}
.palres{max-height:52vh;overflow:auto}
.palitem{display:flex;align-items:center;gap:11px;padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
.palitem:hover.palitem.sel{background:var(--hover)}
.palitem .pk{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);background:var(--chip);
  padding:2px 7px;border-radius:5px;flex:0 0 auto}
.palitem .pt{font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palitem .ps{font-size:11.5px;color:var(--mut);flex:0 0 auto}
.palfoot{padding:9px 18px;font-size:11.5px;color:var(--mut);display:flex;gap:16px;background:var(--surface2)}
kbd{background:var(--chip);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-size:10.5px;font-family:ui-monospace,monospace;color:var(--txt2)}

/* in-view tabs */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 14px;
  font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* gauges + rings */
.gaugewrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.gauge{display:flex;gap:16px;align-items:center;min-width:0}
.gauge .ring{flex:0 0 128px}
.gauge .gi{min-width:0;flex:1}
.gauge h4{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
.gauge .gv{font-size:38px;font-weight:700;letter-spacing:-1.8px;line-height:1.05;margin-top:2px}
.gmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:8px}
.gmeta b{color:var(--txt2);font-weight:600}
.bento{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.bento>*{grid-column:span 4}
.bento .w6{grid-column:span 6}.bento .w8{grid-column:span 8}.bento .w12{grid-column:span 12}
@media(max-width:1080px){.bento>*{grid-column:span 12}}
.hint{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.hint:before{content:"⌁";color:var(--brand)}


/* -------- coming soon: the form stays visible behind glass -------- */
.comingsoon{position:relative;border-radius:10px;overflow:hidden}
.comingsoon .cs-form{filter:blur(3.5px) saturate(.7);opacity:.65;pointer-events:none;user-select:none;
  transform:scale(.995)}
.cs-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;text-align:center;padding:24px;
  background:color-mix(in srgb,var(--surface) 55%,transparent);
  backdrop-filter:blur(6px) saturate(1.1);-webkit-backdrop-filter:blur(6px) saturate(1.1);
  border:1px solid color-mix(in srgb,var(--line2) 70%,transparent);border-radius:10px}
.cs-badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--brand) 32%,transparent);padding:5px 12px;border-radius:20px}
.cs-veil h4{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--txt)}
.cs-veil p{font-size:13px;color:var(--mut);max-width:400px;line-height:1.65}
@media (prefers-reduced-motion: no-preference){
  .cs-badge{animation:csPulse 3.4s ease-in-out infinite}
  @keyframes csPulse{0%,100%{opacity:1}50%{opacity:.62}}
}

/* ---------------- accessibility ---------------- */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brand);color:#fff;
  padding:10px 16px;border-radius:0 0 8px 0;font-size:13px;font-weight:600}
.skip:focus{left:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
[data-act]{cursor:pointer}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.charttable{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.charttable th.charttable td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left}
.charttable th{color:var(--mut);font-weight:600;font-size:11px}
.charttable td.n.charttable th.n{text-align:right;font-variant-numeric:tabular-nums}
.chartswap{display:flex;justify-content:flex-end;padding:0 12px 8px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
@media(max-width:1100px){ .topnav{order:3;flex-basis:100%;padding-bottom:8px;overflow-x:auto} }
@media(max-width:640px){ main{padding:14px 12px 40px} .vh h2{font-size:20px} .kpi .val{font-size:25px} }
</style>

se systems are governed.","geographicScope":"National","updateFrequency":"annual","definition":"Whether a public register of AI systems used by the state is published, covering the deploying institution, the model, the legal basis, a risk classification, the human oversight arrangement and the route to redress.","methodology":"Ordinal. 0 none; 50 a public inventory exists but without risk, oversight or redress metadata; 100 a transparency register meeting the full definition.","universe":null,"raiaPillar":"policy-responsible-ai"},{"code":"L26-AIEVAL","name":"National model evaluation capability","output":"O13","dimension":"D6","unit":"Y/N","normalisation":"binary","polarity":"positive","baseline":0,"target":1,"indexMembership":"readiness","reportingOrganisation":"MINICT","sourceId":"LANDSCAPE26","relevance":3,"accessibility":3,"origin":"LANDSCAPE26","capabilityGate":null,"evidenceType":"administrative","note":"The Health Intelligence Centre contains the only formally resourced model evaluation function in the country. Confirmed absent by the government's own catalogue. The Policy & Responsible AI pillar lists under What Needs To Be Built: model assurance and AI testing and evaluation capability, tools and institutions that verify AI systems before and during deployment.","geographicScope":"National","updateFrequency":"annual","definition":"Whether a national capability exists to independently evaluate AI model performance and safety.","methodology":"Binary assessment. Vendor accuracy claims currently have no domestic verifier.","universe":null,"corroboratedBy":"RAIA_CATALOGUE","raiaPillar":"policy-responsible-ai"},{"code":"L26-AIPROC","name":"AI procurement standard with continuity and exit terms","output":"O8","dimension":"D4","unit":"Y/N","normalisation":"binary","polarity":"positive","baseline":0,"target":1,"indexMembership":"readiness","reportingOrganisation":"RPPA","sourceId":"LANDSCAPE26","relevance":3,"accessibility":3,"origin":"LANDSCAPE26","capabilityGate":null,"evidenceType":"administrative","note":"Rwanda's largest digital health deployment reached close to a fifth of the population and collapsed in 2023 when its foreign parent entered bankruptcy. Not claimed anywhere in the government's own catalogue. The Financing & Partnerships pillar lists outcome-based payment-verification machinery as still to be built.","geographicScope":"National","updateFrequency":"annual","definition":"Whether a national AI procurement standard exists covering continuity, data portability and exit.","methodology":"Binary assessment. The state is anchor buyer without continuity or exit terms.","universe":null,"corroboratedBy":"RAIA_CATALOGUE","raiaPillar":"governance"},{"code":"L26-AIOWN","name":"National term on ownership of fine-tuned models","output":"O13","dimension":"D6","unit":"Y/N","normalisation":"binary","polarity":"positive","baseline":0,"target":1,"indexMembership":"readiness","reportingOrganisation":"MINICT","sourceId":"LANDSCAPE26","relevance":3,"accessibility":3,"origin":"LANDSCAPE26","capabilityGate":null,"evidenceType":"administrative","note":"The cheapest of the identified gaps to close and, on the review's assessment, the most valuable to Rwanda's position in the value chain.","geographicScope":"National","updateFrequency":"annual","definition":"Whether a standard national contractual term defines ownership of models fine-tuned on Rwandan public data.","methodology":"Binary assessment.","universe":null,"raiaPillar":"policy-responsible-ai"},{"code":"L26-AGENCY","name":"Standalone national AI agency established","output":"O8","dimension":"D4","unit":"Y/N","normalisation":"binary","polarity":"positive","baseline":0,"target":1,"indexMembership":"readiness","reportingOrganisation":"MINICT","sourceId":"LANDSCAPE26","relevance":3,"accessibility":3,"origin":"LANDSCAPE26","capabilityGate":null,"evidenceType":"administrative","note":null,"geographicScope":"National","updateFrequency":"annual","definition":"Whether a dedicated standalone national AI institution exists, distinct from an office inside a ministry.","methodology":"Binary assessment. Approved by Cabinet on 8 June 2026; Africa's first standalone national AI institution.","universe":null,"raiaPillar":"governance"},{"code":"RAIA-FIBRE","name":"National fibre optic network deployed","output":"O5","dimension":"D2","unit":"km","normalisation":"goalpost","polarity":"positive","baseline":25000,"target":40000,"indexMembership":"readiness","reportingOrganisation":"RURA","sourceId":"RAIA_CATALOGUE","relevance":3,"accessibility":3,"origin":"RAIA_CATALOGUE","capabilityGate":null,"evidenceType":"administrative","note":null,"geographicScope":"National","updateFrequency":"annual","definition":"Kilometres of national fibre optic backbone deployed.","methodology":"Self-reported by RAIA in the national AI catalogue. The measurement date and whether the figure counts backbone only or includes last-mile distribution are not published.","universe":null,"raiaPillar":"compute"},{"code":"RAIA-DIGITALID","name":"Digital identity coverage","output":"O7","dimension":"D3","unit":"%","normalisation":"goalpost","polarity":"positive","baseline":95,"target":100,"indexMembership":"readiness","reportingOrganisation":"NIDA","sourceId":"RAIA_CATALOGUE","relevance":3,"accessibility":3,"origin":"RAIA_CATALOGUE","capabilityGate":null,"evidenceType":"administrative","note":null,"geographicScope":"National","updateFrequency":"annual","definition":"Share of the population holding a digital identity, the identity rail on which trusted data services depend.","methodology":"RAIA's catalogue states near-universal coverage without a figure. Recorded here as 95% pending a published number, and flagged in_review for that reason.","universe":null,"raiaPillar":"data"},{"code":"RAIA-STEMGRAD","name":"STEM graduates per year","output":"O3","dimension":"D1","unit":"persons","normalisation":"log","polarity":"positive","baseline":50000,"target":80000,"indexMembership":"readiness","reporti erification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2021","year":2021,"value":38.096025645239244,"collectedOn":"2021-06-30","sourceId":"GITHUB","verification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2022","year":2022,"value":42.2141338712559,"collectedOn":"2022-06-30","sourceId":"GITHUB","verification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2023","year":2023,"value":43.546433332136914,"collectedOn":"2023-06-30","sourceId":"GITHUB","verification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2024","year":2024,"value":46.79090797048444,"collectedOn":"2024-06-30","sourceId":"GITHUB","verification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2025","year":2025,"value":49.38821980656995,"collectedOn":"2025-06-30","sourceId":"GITHUB","verification":"unverified","staleCycles":0,"origin":"demo","note":"Demo value generated to populate the series. Not reported by the attributed source."},{"indicator":"TOR96","period":"2026","year":2026,"value":null,"collectedOn":"2026-06-30","sourceId":"GITHUB","verification":"not_reported","staleCycles":0,"origin":"source-reported","note":"Not reported for this cycle. Excluded from aggregation and counted against coverage, never treated as zero."}]},"journey":{"version":1,"items":[{"y":2014,"t":"First AI-enabled ventures established","d":"Zipline and Charis UAS are founded, later becoming Rwanda's most visible applied-AI deployments in logistics and geospatial analysis.","cat":"Ecosystem","src":"AIRM22","status":"verified"},{"y":2016,"t":"Babyl launches AI-supported triage","d":"AI-supported triage and teleconsultation enters the Rwandan health system, later cited as the country's single public–private AI partnership.","cat":"Adoption","src":"AIRM22","status":"verified"},{"y":2018,"t":"Rwanda Innovation Fund launched","d":"A technology and innovation fund created to address the financing gap facing tech-enabled companies at different growth stages.","cat":"Investment","src":"ECON22","status":"verified"},{"y":2019,"t":"Open-source AI activity becomes visible","d":"GitHub commits from Rwanda rise more than 400% between 2018 and 2019, the first measurable signal of an informal developer community.","cat":"Skills","src":"AIRM22","status":"verified"},{"y":2020,"t":"C4IR Rwanda established","cat":"Ecosystem","src":"WEF_C4IR","status":"verified","d":"The Centre for the Fourth Industrial Revolution Rwanda is set up in partnership with the World Economic Forum, with a mandate focused on data governance, artificial intelligence and machine learning. It becomes the institutional home for most of the measurement work that follows, the 2021 landscape mapping, the 2022 economic sizing and the readiness framework all originate here."},{"y":2020,"t":"Centre of Excellence in Digitalisation and AI announced","d":"A joint venture announced in November 2020 to focus on research, development and delivery of AI, security and critical-infrastructure solutions, with an associated training academy.","cat":"Ecosystem","src":"AIRM22","status":"verified"},{"y":2021,"t":"Data protection and privacy law enacted","d":"Establishes mechanisms for personal data protection, provides for free flow of non-personal data, and promotes data localisation. It does not refer to AI explicitly but governs processing regardless of the technology used.","cat":"Regulation","src":"AIRM22","status":"verified"},{"y":2021,"t":"Oxford Government AI Readiness position recorded","d":"Rwanda scores 35.16 and ranks 112 of 172 countries. 10th in Africa, behind South Africa, Kenya and Ghana. Sub-Saharan Africa averages 31.61, the lowest of any region.","cat":"Benchmark","src":"OXFORD","status":"verified"},{"y":2021,"t":"Rwanda AI Landscape Overview published","d":"C4IR maps the national AI ecosystem, establishing the baseline for later measurement work.","cat":"Policy","src":"LANDSCAPE21","status":"verified"},{"y":2022,"t":"AI Readiness and Maturity Framework and first-round assessment","d":"Six dimensions, 14 policy outputs and an 89-indicator main set, with a dashboard built on a 280-indicator landscape. The first round found six of eight examined institutions had no data custodian.","cat":"Evidence","src":"AIRM22","status":"verified"},{"y":2022,"t":"AI economic potential quantified","d":"The full potential of AI and advanced analytics in Rwanda is sized at ~USD 589m, about 6% of GDP, with five lighthouse use cases identified for early implementation.","cat":"Evidence","src":"ECON22","status":"verified"},{"y":2022,"t":"C4IR Rwanda officially launched. Africa's first","cat":"Ecosystem","src":"WEF_C4IR","status":"verified","d":"Formally inaugurated in Kigali on 31 March 2022, the first C4IR to be officially launched on the African continent. It joins a global network of centres shaping technology governance policy, and anchors Rwanda's subsequent AI Scaling Hub and national AI programme work."},{"y":2022,"t":"National AI ethics framework drafted","d":"Developed and submitted for board approval, with an awareness and capacity-building programme launched alongside it. Publication remains the binding constraint on the maturity level.","cat":"Regulation","src":"AIRM22","status":"verified"},{"y":2022,"t":"National AI policy developed","d":"Six priority policy areas defined across three enablers, two accelerators and one safeguard. At the time of the readiness assessment the policy was awaiting formal Cabinet approval.","cat":"Policy","src":"AIRM22","status":"verified"},{"y":2023,"t":"National AI Policy adopted, first in Africa","cat":"Policy","src":"LANDSCAPE26","status":"verified","d":"Rwanda adopts the continent's first national AI policy. In the same year the 2021 data protection law becomes enforceable, completing a deliberate sequence: legislate on data, then strategise on AI."},{"y":2024,"t":"NST2 approved and the AI Playbook for Small States published","cat":"Policy","src":"LANDSCAPE26","status":"verified","d":"AI is embedded in the second National Strategy for Transformation, and Rwanda co-authors guidance for small states pursuing AI."},{"y":2025,"t":"Global AI Summit hosted; Health Intelligence Centre and Scaling Hub launched","cat":"Adoption","src":"LANDSCAPE26","status":"verified","d":"Rwanda hosts the continent's Global AI Summit, opens the National Health Intelligence Centre in April, launches the USD 17.5m AI Scaling Hub with the Gates Foundation and C4IR, and adopts a national Data Sharing Policy."},{"y":2026,"t":"Horizon 1000 launched and the DPI Strategy adopted","cat":"Investment","src":"LANDSCAPE26","status":"verified","d":"USD 50m Gates Foundation and OpenAI programme places AI in 1,000 primary care clinics by 2028, with Rwanda as first launch country. A three-year government MOU with Anthropic covers malaria, maternal mortality and cervical cancer elimination."},{"y":2026,"t":"Institute of Computing opens","cat":"Skills","src":"LANDSCAPE26","status":"verified","d":"Opened September 2026 offering AI and cybersecurity degrees. First graduates in 2029, until then the binding constraint on delivery is engineers rather than policy."},{"y":2026,"t":"Kinyarwanda model suite released open source","cat":"Evidence","src":"LANDSCAPE26","status":"verified","d":"KinyaBERT, KinyaColBERT and Flex-TTS released in March 2026, giving Rwanda the only genuinely sovereign layer of its AI stack and underpinning the Tunga farmer advisory service."},{"y":2026,"t":"Measured usage gap quantified","cat":"Benchmark","src":"ANTHROPIC_EI","status":"verified","d":"Rwanda ranks 111 of 121 globally on measured frontier AI usage at 0.20x the level expected for its economic size, first in Africa on governance, near the bottom on observed use."},{"y":2026,"t":"National AI Agency approved by Cabinet","cat":"Policy","src":"LANDSCAPE26","status":"verified","d":"Africa's first standalone national AI institution, approved 8 June 2026, succeeding the AI Office in the ICT ministry. Its mandate spans government transformation, research, skilling, ethics and safety, industry growth, commercialisation, investment and international engagement, with the national data centre and a governed data sandbox as instruments."},{"y":2026,"t":"RAIA publishes the Rwanda Digital AI Catalogue","cat":"Policy","src":"RAIA_CATALOGUE","status":"verified","d":"RAIA publishes a national AI investment catalogue setting out eight enablement pillars, governance, policy and responsible AI, compute, data, platforms and intelligence, financing, skills, and innovation and research. Each pillar states what exists today and what still needs to be built, which makes it the first official document to put Rwanda's AI capability gaps on the record."},{"y":2026,"t":"The verified national record goes live","cat":"Evidence","src":"RAIA_CATALOGUE","status":"verified","d":"Rwanda publishes a consolidated, filterable inventory of AI use cases: 34 verified entries across 43 institutions plus 10 policy and education enablers, each reviewed against primary documentation and dated. This closes a gap this platform had recorded as open, though as an investment catalogue rather than an accountability register, it carries sector and stage rather than risk classification, oversight arrangements or routes to redress."}]},"policies":{"version":1,"items":[{"n":"National AI Policy","owner":"MINICT","year":2022,"status":"In force (contributed, pending verification)","cat":"AI policy","d":"Defines six priority policy areas: three enablers (skills, infrastructure and compute, data strategy), two accelerators (public and private sector adoption) and one safeguard (practical ethical guidelines). The readiness framework exists to monitor its implementation.","src":"AIRM22","url":"https://www.minict.gov.rw","onNationalRecord":true,"raiaId":"EN-01"},{"n":"Data Protection and Privacy Law","owner":"NCSA","year":2021,"status":"In force","cat":"Data protection","d":"Provides mechanisms for personal data protection and privacy in processing, ensures free flow of non-personal data, and promotes data localisation. Governs processing regardless of the technology used.","src":"AIRM22","url":"https://www.dataprotection.gov.rw","onNationalRecord":true,"raiaId":"EN-06"},{"n":"Guidelines on the Ethical Development and Implementation of AI","owner":"RURA","year":2022,"status":"Drafted, pending board approval","cat":"AI ethics","d":"A national ethics framework developed with an accompanying awareness and capacity-building programme. Publication is a capability gate for the next maturity level and a scoring precondition in global indices.","src":"AIRM22","url":"https://rura.rw"},{"n":"Smart Rwanda Master Plan","owner":"MINICT","year":2016,"status":"In force","cat":"Digital transformation","d":"The digital transformation programme that established the platforms, connectivity and e-government services AI adoption now builds on.","src":"ECON22","url":"https://www.minict.gov.rw"},{"n":"National data governance frameworks","owner":"RISA","year":2022,"status":"In force","cat":"Data governance","d":"Frameworks and protocols for the collection, storage, processing and sharing of data across government.","src":"AIRM22","url":"https://risa.gov.rw"},{"n":"Digital Ambassadors Programme","owner":"MINICT","year":2017,"status":"In force","cat":"Digital skills","d":"Community-delivered training aiming to equip five million citizens with basic IT skills and bring them online.","src":"ECON22","url":"https://www.minict.gov.rw"},{"n":"Regulatory sandbox framework","owner":"RURA","year":2024,"status":"Partially operational","cat":"Innovation regulation","d":"A controlled environment for testing AI and data-driven services. Launch and uptake are both tracked indicators and capability gates for maturity level 4.","src":"AIRM22","url":"https://rura.rw"},{"n":"Open Data Charter","owner":"MINICT","year":null,"status":"Not a signatory","cat":"International commitment","d":"Rwanda is not currently a signatory. Signing is one of the capability gates for the highest maturity level and is directly tracked by the Tortoise index.","src":"AIRM22","url":"https://opendatacharter.net"},{"n":"ISO/IEC JTC 1/SC 42. Artificial Intelligence","owner":"MINICT","year":null,"status":"Observer participation","cat":"International standards","d":"Participation level in the international AI standards committee. The 2022 assessment recorded no participation; contributed data indicates observer status since 2024.","src":"CONTRIB","url":"https://www.iso.org/committee/6794475.html"},{"n":"National AI Agency (establishment)","owner":"MINICT","year":2026,"status":"Approved by Cabinet, 8 June 2026","cat":"AI governance","d":"Africa's first standalone national AI institution, succeeding the AI Office in the ICT ministry. Mandate spans government transformation, research, skilling, ethics and safety, industry growth, commercialisation, investment and international engagement. Instruments are the national data centre and a governed data sandbox. Expressly designed to build on existing institutions, not replace them.","src":"LANDSCAPE26","url":null},{"n":"National Data Sharing Policy","owner":"RISA","year":2025,"status":"In force","cat":"Data governance","d":"Establishes the terms on which government-held data can be shared for analytical and AI use. Partly addresses the access-to-AI-ready-data constraint named in the AI Agency's mandate.","src":"LANDSCAPE26","url":null,"onNationalRecord":true,"raiaId":"EN-03"},{"n":"Digital Public Infrastructure Strategy","owner":"RISA","year":2026,"status":"In force","cat":"Digital transformation","d":"Sets the DPI direction within which AI services are to be delivered.","src":"LANDSCAPE26","url":null},{"n":"NST2. Second National Strategy for Transformation","owner":"MINECOFIN","year":2024,"status":"In force","cat":"National strategy","d":"National development strategy within which the AI programme sits. Includes a 5 to 6 percent measured AI economic contribution target to be reported against by 2030.","src":"LANDSCAPE26","url":null},{"n":"AI-specific legislation","owner":"MINICT","year":null,"status":"Not in place","cat":"AI regulation","d":"No AI-specific law exists. Enforcement rests on the data protection regime alone. Identified in the 2026 review as a low-cost, high-value gap.","src":"LANDSCAPE26","url":null},{"n":"Public register of state AI systems","owner":"MINICT","year":null,"status":"Not in place","cat":"Transparency","d":"Automated enforcement runs with no transparency duty. A public register would make state AI systems auditable.","src":"LANDSCAPE26","url":null},{"n":"AI procurement standard","owner":"RPPA","year":null,"status":"Not in place","cat":"Procurement","d":"The state is anchor buyer without continuity, data portability or exit terms. The 2023 collapse of Rwanda's largest digital health deployment, which reached close to a fifth of the population, is the governing precedent.","src":"LANDSCAPE26","url":null},{"n":"National term on ownership of fine-tuned models","owner":"MINICT","year":null,"status":"Not in place","cat":"Sovereignty","d":"Ownership of models fine-tuned on Rwandan public data is undefined. Costs nothing to draft and changes Rwanda's position in the value chain, the cheapest identified gap and, on the review's assessment, the most valuable.","src":"LANDSCAPE26","url":null},{"n":"National model evaluation capability","owner":"MINICT","year":null,"status":"Not in place","cat":"Assurance","d":"Vendor accuracy claims have no domestic verifier. The Health Intelligence Centre holds the only formally resourced evaluation function in the country. A country that wants to be a testbed must be able to certify what was tested.","src":"LANDSCAPE26","url":null},{"n":"AI Readiness and Maturity Framework for Rwanda","owner":"Ministry of ICT and Innovation","year":2023,"status":"In force","cat":"AI governance","d":"How readiness is measured across institutions, and what each maturity level requires before an institution can deploy.","src":"RAIA_CATALOGUE","url":null,"onNationalRecord":true,"raiaId":"EN-02","dated":"November 2023"},{"n":"National Broadband Policy and Strategy","owner":"Ministry of ICT and Innovation","year":2022,"status":"In force","cat":"AI governance","d":"The connectivity floor that AI services depend on, and the targets against which coverage is tracked.","src":"RAIA_CATALOGUE","url":null,"onNationalRecord":true,"raiaId":"EN-04","dated":"October 2022"},{"n":"AI Playbook for Small States","owner":"Ministry of ICT and Innovation","year":2025,"status":"In force","cat":"AI governance","d":"Rwanda's playbook for how a small state builds AI capability without the budget of a large one.","src":"RAIA_CATALOGUE","url":null,"onNationalRecord":true,"raiaId":"EN-05","dated":"September 2025"}]},"glossary":{"version":1,"items":[{"t":"Artificial intelligence (AI)","d":"The ability of a computer to perform tasks that normally require human intelligence, visual perception, speech recognition, decision-making, translation between languages. The 2022 economic sizing study deliberately used a broad definition covering both AI and traditional advanced analytics, because in an economy at Rwanda's stage most of the near-term value comes from analytics applied to existing processes.","src":"ECON22"},{"t":"Machine learning","d":"The subset of AI in which a system learns patterns from data rather than following rules written by a programmer. Supervised learning, the most common commercial form, needs labelled examples, which is why the count of annotated Rwandan datasets is tracked as an indicator in its own right.","src":"AIRM22"},{"t":"Generative AI","d":"Models that produce new text, images, code or audio rather than only classifying or predicting. Note that the 2022 sizing study predates the commercial generative wave and explicitly measured only the technology available at the time, so its estimates neither include nor anticipate generative AI.","src":"ECON22"},{"t":"Advanced analytics","d":"Analysing large datasets with advanced techniques to find trends, make predictions and recommend action. Treated as in-scope alongside AI in the economic sizing.","src":"ECON22"},{"t":"AI infrastructure","d":"Connectivity, electricity, data centres, cloud services and accelerated compute, the physical capacity to train, host and serve models. Tracked through dimension D2.","src":"AIRM22"},{"t":"AI ecosystem","d":"The organisations that create and sustain AI activity: start-ups, corporates, universities, research centres, incubators, investors, regulators and public agencies, and the relationships between them.","src":"AIRM22"},{"t":"AI governance","d":"The rules, institutions and accountability mechanisms that determine how AI may be developed and used, data protection law, ethics guidelines, sector regulation, standards participation and an accountable national body.","src":"AIRM22"},{"t":"AI readiness","d":"Whether the preconditions for AI are in place: skills, infrastructure, data and the institutions to govern them. Readiness can be high while actual use remains low.","src":"AIRM22"},{"t":"AI maturity","d":"How far AI is actually deployed, funded, governed and producing outcomes. The gap between readiness and maturity is the conversion deficit, capability that has not yet become deployment.","src":"AIRM22"},{"t":"AI adoption","d":"Observed use of AI in production by an organisation. Measured here through a registry of use cases with a lifecycle stage, rather than through self-reported survey claims.","src":"AIRM22"},{"t":"Full potential (economic sizing)","d":"The value that would be created if today's AI applications were adopted across the whole economy. It is an order-of-magnitude ceiling for prioritisation, not a forecast, not a target, and not value captured.","src":"ECON22"},{"t":"Coverage","d":"The share of an index's weighted indicators that actually have a reported observation this cycle. A score computed on 60% coverage is not the same claim as one computed on 95%, and the platform always shows which.","src":"AIRM22"},{"t":"Confidence","d":"A 0–1 composite of source reliability, data accessibility, recency and validation level. It is published beside a score and never used to adjust it.","src":"AIRM22"}]},"useCases":{"version":1,"items":[{"id":"UC-001","name":"AI-supported triage and teleconsultation","org":"BABYL","sector":"HLT","stage":"Scaled","since":2016,"district":"RW-KG-NYA","publicSector":true,"risk":"High","src":"AIRM22","status":"verified","desc":"Symptom triage supporting remote consultation at national scale within the health system.","onNationalRecord":false,"origin":"demo"},{"id":"UC-002","name":"Autonomous medical delivery","org":"ZIPLINE","sector":"TRA","stage":"Scaled","since":2016,"district":"RW-SO-MUH","publicSector":true,"risk":"Medium","src":"AIRM22","status":"verified","desc":"On-demand drone delivery of blood and essential medicines; AI used for routing and trajectory planning.","onNationalRecord":true,"raiaName":"Autonomous medicine drone delivery","origin":"demo"},{"id":"UC-003","name":"Smart traffic control","org":"RNP","sector":"PUB","stage":"Production","since":2019,"district":"RW-KG-GAS","publicSector":true,"risk":"High","src":"AIRM22","status":"verified","desc":"AI applications for smart traffic lights and traffic control systems.","onNationalRecord":false,"origin":"demo"},{"id":"UC-004","name":"Fraud detection and cash management","org":"BNR","sector":"FIN
