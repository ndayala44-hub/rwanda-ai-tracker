# Netlify — static hosting for the dashboard.
#
# Netlify Functions do not run Python natively, so this is a static deployment:
# the dashboard serves from its published snapshot. Use Render, Fly.io or Vercel
# if you want the live FastAPI backend.
[build]
  command = "npm run build:web && cp deploy/app-config.static.js apps/web/app-config.js"
  publish = "apps/web"

[build.environment]
  NODE_VERSION = "20"
  NPM_CONFIG_PRODUCTION = "false"   # the build needs devDependencies

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
